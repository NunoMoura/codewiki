id: lifecycle
purpose: Show accountable intent entering through Host and Runtime-orchestrated Loops, Verification, accepted Knowledge, and Change Trace.
components:
  - { id: clients, concept: /system/components/clients.md, label: Clients, zone: client }
  - { id: host, concept: /system/components/host.md, label: Host Service, zone: client }
  - { id: api, concept: /system/components/api.md, label: API, zone: core }
  - { id: intake, concept: /system/components/change-intake.md, label: Change Intake, zone: core }
  - { id: runtime, concept: /system/components/runtime.md, label: Runtime, zone: core }
  - { id: decision, concept: /system/components/decision.md, label: Decision, zone: core }
  - { id: planning, concept: /system/components/planning.md, label: Planning, zone: core }
  - { id: implementation, concept: /system/components/implementation.md, label: Implementation, zone: core }
  - { id: verification, concept: /system/components/verification.md, label: Verification, zone: core }
  - { id: knowledge, concept: /system/components/knowledge.md, label: Knowledge, zone: repository }
  - { id: change-trace, concept: /system/components/change-trace.md, label: Change Trace, zone: repository }
connections:
  - { id: clients-request-host, from: clients, to: host, type: invokes, label: submits bounded authenticated request }
  - id: host-invokes-api
    from: host
    to: api
    type: invokes
    label: translates one versioned protocol binding
    boundary: { type: trust, failure: Reject unauthenticated, malformed, expired, or oversized input. }
  - { id: api-invokes-runtime, from: api, to: runtime, type: invokes, label: delegates admission and authority }
  - { id: runtime-invokes-intake, from: runtime, to: intake, type: invokes, label: normalizes proposed intent }
  - { id: intake-returns-runtime, from: intake, to: runtime, type: returns, label: returns admitted proposed intent }
  - { id: runtime-invokes-decision, from: runtime, to: decision, type: invokes, label: starts selected exact revision }
  - { id: decision-returns-runtime, from: decision, to: runtime, type: returns, label: returns immutable Decision Candidate }
  - { id: runtime-verifies-decision, from: runtime, to: verification, type: invokes, label: evaluates Decision Candidate }
  - { id: verification-returns-runtime, from: verification, to: runtime, type: returns, label: returns exact Exit Report }
  - id: runtime-writes-knowledge
    from: runtime
    to: knowledge
    type: writes
    label: accepts verified desired state
    boundary: { type: persistence, failure: Preserve prior accepted Knowledge revision. }
  - { id: runtime-invokes-planning, from: runtime, to: planning, type: invokes, label: starts Planning for approved meaning }
  - { id: planning-returns-runtime, from: planning, to: runtime, type: returns, label: returns immutable Planning Candidate }
  - { id: runtime-verifies-planning, from: runtime, to: verification, type: invokes, label: evaluates Planning Candidate }
  - { id: verification-returns-runtime-planning, from: verification, to: runtime, type: returns, label: returns exact Exit Report }
  - { id: runtime-invokes-implementation, from: runtime, to: implementation, type: invokes, label: starts eligible realization }
  - { id: implementation-returns-runtime, from: implementation, to: runtime, type: returns, label: returns integrated Implementation Candidate }
  - { id: runtime-verifies-implementation, from: runtime, to: verification, type: invokes, label: evaluates Implementation Candidate }
  - { id: verification-returns-runtime-implementation, from: verification, to: runtime, type: returns, label: returns exact Exit Report }
  - id: runtime-writes-change-trace
    from: runtime
    to: change-trace
    type: writes
    label: appends accepted operation
    boundary: { type: persistence, failure: Reject append and retain prior accepted head. }
flows:
  - concept: /system/flows/change-lifecycle.md
    paths:
      - connections: [clients-request-host, host-invokes-api, api-invokes-runtime, runtime-invokes-intake, intake-returns-runtime, runtime-invokes-decision, decision-returns-runtime, runtime-verifies-decision, verification-returns-runtime, runtime-writes-knowledge]
      - connections: [implementation-returns-runtime, runtime-verifies-implementation, verification-returns-runtime-implementation, runtime-writes-change-trace]
  - concept: /system/flows/decision-to-planning.md
    paths:
      - connections: [runtime-invokes-decision, decision-returns-runtime, runtime-verifies-decision, verification-returns-runtime, runtime-invokes-planning]
  - concept: /system/flows/planning-to-implementation.md
    paths:
      - connections: [runtime-invokes-planning, planning-returns-runtime, runtime-verifies-planning, verification-returns-runtime-planning, runtime-invokes-implementation]
