schema_version: 1
id: spec.system.diagrams.data-model
title: CodeWiki Canonical and Projected Data Model
kind: data_model
purpose: Show authority roots, Change Trace Protocol operations, Git acceptance, exact Loop-exit identity chain, rolling Planning, coordination, Alignment Graph projection, archive, and repair learning.
source_docs:
  - .codewiki/kb/system/components/alignment-model.md
  - .codewiki/kb/system/components/knowledge.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/components/work-state.md
  - .codewiki/kb/system/components/loop-exit.md
  - .codewiki/kb/system/components/evidence.md
  - .codewiki/kb/system/components/planning-loop.md
renderer:
  preferred: entity_relationship
  fallback: mermaid_flowchart
entities:
  - id: knowledge
    label: OKF Knowledge concept and authored relationships
    storage: .codewiki/kb/**/*.md
    truth: true
  - id: change
    label: Change accountable intent and logical dossier
    storage: derived aggregate over accepted operations
    truth: true
  - id: operation
    label: Immutable typed content-addressed Change operation
    storage: JSONL hot/archive segment
    truth: true
  - id: state_commit
    label: StateCommitManifest + Git acceptance commit
    storage: refs/heads/codewiki/state
    truth: true
  - id: planning_epoch
    label: Immutable PlanningEpochRecord
    storage: project-scoped content-addressed record accepted by state commit
    truth: true
  - id: candidate
    label: Exact immutable Loop Candidate
    storage: loop-specific candidate-recorded operation
    truth: true
  - id: evidence
    label: Immutable typed Evidence Record
    storage: evidence.recorded operation; large bytes behind exact refs
    truth: true
    kinds:
      - research_citation
      - source_observation
      - command_execution
      - ui_capture
      - model_assessment
      - worker_report
      - integration_proof
      - approval_receipt
      - delivery_attestation
      - outcome_observation
  - id: exit_policy
    label: Resolved Exit Policy
    storage: loop.exit_policy_recorded operation
    truth: true
  - id: check_result
    label: Check Result
    storage: check.result_recorded operation
    truth: true
  - id: exit_report
    label: Exit Report
    storage: loop.exit_report_recorded operation
    truth: true
  - id: runtime_route
    label: Runtime Route
    storage: runtime.route_recorded operation
    truth: true
  - id: work_item
    label: Immutable Work Item inside Planning Candidate/epoch
    storage: PlanningEpochRecord
    truth: true
  - id: change_claim
    label: Change Claim
    storage: Change Claim operations
    truth: true
  - id: work_item_claim
    label: Work Item Claim
    storage: Work Item Claim operations
    truth: true
  - id: assignment
    label: Assignment lifecycle
    storage: Assignment operations plus private packet refs
    truth: true
  - id: worker_report
    label: Asserted immutable Worker Report
    storage: worker.report_recorded operation plus private artifact
    truth: true
  - id: source_test
    label: Source / tests / source-owned docs
    storage: protected source Git tree
    truth: true
  - id: git_effect
    label: Integration / merge / push / publication / release / outcome proof
    storage: Git/provider objects and bounded accepted operations
    truth: true
  - id: archive_manifest
    label: ArchiveManifest and immutable Trace segments
    storage: refs/heads/codewiki/archive
    truth: true
  - id: work_state
    label: WorkState snapshot
    storage: memory or disposable local materialization
    truth: false
  - id: alignment_graph
    label: Alignment Graph snapshot with per-fact provenance
    storage: memory or disposable index
    truth: false
  - id: runtime_private
    label: Worker Workbench / raw artifact / cache / recovery
    storage: .codewiki/runtime/**
    truth: false
  - id: generated_view
    label: Dashboard / Work / graph layout / query rendering
    storage: memory or .codewiki/views/**
    truth: false
  - id: repair_episode
    label: Derived Repair Episode / Repair Pattern
    storage: disposable archive-derived index
    truth: false
relationships:
  - from: change
    to: operation
    label: has ordered causal history
  - from: state_commit
    to: operation
    label: atomically accepts exact batch
  - from: operation
    to: operation
    label: declares typed causal parents
  - from: planning_epoch
    to: change
    label: atomically binds exact participant revisions
  - from: planning_epoch
    to: work_item
    label: defines immutable work
  - from: change
    to: candidate
    label: evaluated through one semantic Loop attempt
  - from: candidate
    to: evidence
    label: binds every considered observation
  - from: candidate
    to: exit_policy
    label: resolves exact active Checks
  - from: evidence
    to: check_result
    label: exact supporting/contradicting/excluded input
  - from: exit_policy
    to: check_result
    label: requires one Result per active binding
  - from: candidate
    to: check_result
    label: exact subject
  - from: check_result
    to: exit_report
    label: complete deterministic fan-in
  - from: exit_report
    to: runtime_route
    label: informs but does not authorize effects
  - from: change_claim
    to: change
    label: exclusive semantic-purpose authority
  - from: work_item_claim
    to: work_item
    label: exclusive Assignment authority
  - from: work_item_claim
    to: assignment
    label: activates exact attempt
  - from: assignment
    to: worker_report
    label: produces asserted outcome
  - from: worker_report
    to: evidence
    label: materializes bounded admitted observation
  - from: source_test
    to: candidate
    label: exact realization input
  - from: git_effect
    to: evidence
    label: supplies observed Integration/delivery/outcome proof
  - from: operation
    to: work_state
    label: deterministic reduction
  - from: knowledge
    to: work_state
    label: accepted meaning and ownership
  - from: source_test
    to: work_state
    label: executable current state
  - from: operation
    to: alignment_graph
    label: canonical binding projection
  - from: knowledge
    to: alignment_graph
    label: authored Knowledge relationships
  - from: source_test
    to: alignment_graph
    label: deterministic or inferred analysis
  - from: work_state
    to: generated_view
    label: current status and scheduling
  - from: alignment_graph
    to: generated_view
    label: bounded semantic query output
  - from: operation
    to: archive_manifest
    label: terminal immutable segment
  - from: check_result
    to: repair_episode
    label: failed or indeterminate origin
  - from: candidate
    to: repair_episode
    label: later repair Candidate
  - from: git_effect
    to: repair_episode
    label: later outcome Evidence
  - from: runtime_private
    to: evidence
    label: materializes bounded digest-bound observation
