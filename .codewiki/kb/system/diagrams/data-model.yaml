schema_version: 1
id: spec.system.diagrams.data-model
title: CodeWiki Data and Evidence Model
kind: data_model
purpose: Show canonical authority roots, exact Loop-exit identity chain, private runtime material, and disposable Work/Alignment/Learning projections.
source_docs:
  - .codewiki/kb/system/components/alignment-model.md
  - .codewiki/kb/system/components/knowledge.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/components/loop-exit.md
  - .codewiki/kb/system/components/worker-workbench.md
renderer:
  preferred: entity_relationship
  fallback: mermaid_flowchart
entities:
  - id: knowledge_doc
    label: OKF Knowledge concept
    storage: .codewiki/kb/**/*.md
    truth: true
  - id: change_trace
    label: Change Trace
    storage: .codewiki/traces/TRACE-CHG-<id>.jsonl
    truth: true
  - id: trace_record
    label: Trace record
    storage: one JSON object per LF-delimited line
    truth: true
    record_types:
      - trace_head
      - trace_event
      - tail_checkpoint
      - trace_close
  - id: candidate
    label: Exact immutable Loop candidate identity
    storage: compact identity/content refs in semantic trace attempt
    truth: true
  - id: exit_policy
    label: Resolved Exit Policy identity
    storage: candidate-specific Check bindings, thresholds, activation, exclusions, and digest
    truth: true
  - id: check_result
    label: Check Result
    storage: exact candidate/Check/evidence/measurement/threshold/findings/status identity
    truth: true
  - id: exit_report
    label: Exit Report
    storage: candidate + policy + complete Result set + reduction version + status
    truth: true
  - id: runtime_route
    label: Runtime route and final guard outcome
    storage: separate trace event data after Exit Report
    truth: true
  - id: source_test
    label: Source / test / accepted package documentation
    storage: src/**, tests/**, and source-owned files
    truth: true
  - id: git_delivery_proof
    label: Git / remote / artifact / outcome proof
    storage: commits, trees, refs, receipts, attestations, and bounded observations
    truth: true
  - id: runtime_private
    label: Workbench / Worker Report / failed material / recovery / cache
    storage: .codewiki/runtime/**
    truth: false
    examples:
      - endpoint and generation metadata
      - Assignment packets and Workbench manifests
      - Worker Reports and bounded raw observations
      - failed candidate material
      - Planning recovery packets
      - Check execution cache
      - learning index cache
  - id: generated_view
    label: Work / Alignment / Learning / dashboard view
    storage: memory or .codewiki/views/**
    truth: false
  - id: repair_episode
    label: Derived Repair Episode
    storage: in-memory or disposable learning cache
    truth: false
  - id: feedback_bundle
    label: User-approved allowlisted Feedback Bundle
    storage: local explicit export file
    truth: false
relationships:
  - from: change_trace
    to: trace_record
    label: contains append-only records
  - from: trace_record
    to: candidate
    label: records exact attempt identity
  - from: candidate
    to: exit_policy
    label: selects deterministic candidate-specific policy
  - from: exit_policy
    to: check_result
    label: requires one Result per active binding
  - from: candidate
    to: check_result
    label: exact subject
  - from: check_result
    to: exit_report
    label: complete fan-in
  - from: candidate
    to: exit_report
    label: exact semantic exit subject
  - from: exit_report
    to: runtime_route
    label: informs but does not authorize route
  - from: knowledge_doc
    to: candidate
    label: exact snapshot/provenance input
  - from: source_test
    to: candidate
    label: exact realization input
  - from: git_delivery_proof
    to: candidate
    label: exact base/evidence input
  - from: trace_record
    to: generated_view
    label: projects
  - from: knowledge_doc
    to: generated_view
    label: projects
  - from: source_test
    to: generated_view
    label: projects
  - from: git_delivery_proof
    to: generated_view
    label: projects
  - from: check_result
    to: repair_episode
    label: starts failed or indeterminate episode
  - from: candidate
    to: repair_episode
    label: repairs earlier candidate
  - from: git_delivery_proof
    to: repair_episode
    label: supplies later outcome
  - from: runtime_private
    to: trace_record
    label: distills bounded durable facts before cleanup
  - from: repair_episode
    to: feedback_bundle
    label: may contribute sanitized CodeWiki issue metadata after review
