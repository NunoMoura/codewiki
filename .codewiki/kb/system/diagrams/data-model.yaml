schema_version: 1
id: spec.system.diagrams.data-model
title: CodeWiki Product and Runtime Data Model
kind: data_model
purpose: Show durable truth, transient handoffs, generated state, coordination state, and executable proof.
source_docs:
  - .codewiki/kb/system/overview.md
  - .codewiki/kb/system/knowledge.md
  - .codewiki/kb/system/builds.md
  - .codewiki/kb/system/roadmap.md
  - .codewiki/kb/system/graph.md
renderer:
  preferred: er
  fallback: mermaid_er
entities:
  - id: knowledge_doc
    label: Knowledge document
    storage: .codewiki/kb/**/*.md
    role: durable product/system intent
    key_fields:
      - id
      - title
      - state
      - summary
      - owners
      - code_paths
  - id: diagram_spec
    label: Diagram spec
    storage: .codewiki/kb/system/diagrams/**/*.yaml
    role: durable agent-editable diagram raw data
    key_fields:
      - schema_version
      - id
      - kind
      - source_docs
  - id: roadmap_task
    label: Roadmap task
    storage: .codewiki/roadmap/**
    role: active work truth and closure state
    key_fields:
      - id
      - title
      - status
      - priority
      - goal
      - spec_paths
      - code_paths
  - id: decision_build
    label: Decision build
    storage: .codewiki/builds/decision/**
    role: accepted intent and knowledge handoff
    key_fields:
      - diff_table
      - approved_diff_rows
      - row_to_kb_mappings
      - propagation
      - knowledge_changes
      - downstream_planning_questions
      - lifecycle
  - id: implementation_build
    label: Implementation build
    storage: .codewiki/builds/implementation/**
    role: implementation evidence and closure brief
    key_fields:
      - task_id
      - code_files
      - test_files
      - checks_run
      - acceptance_mapping
      - closure_brief
  - id: validation_report
    label: Validation report
    storage: .codewiki/validation/**
    role: pass/fail/block gateway evidence when persisted
    key_fields:
      - profile
      - verdict
      - rationale
      - checks
      - issues
  - id: state_index
    label: State index / graph
    storage: .codewiki/index_graph.json
    role: generated state relationship and reconciliation representation
    key_fields:
      - nodes
      - edges
      - lenses
      - reconciliation
  - id: resume_context_packet
    label: Resume context packet
    storage: tool/command output generated from graph and task context
    role: bounded continuation input for current or fresh sessions; not durable truth
    key_fields:
      - task_id
      - source_refs
      - preflight
      - evidence
      - prompt
  - id: scoped_lease
    label: Session queue scoped lease
    storage: .codewiki/session/queue.json
    role: temporary parallel-work lease
    key_fields:
      - id
      - mode
      - scopes
      - expires_at
  - id: executable_truth
    label: Code and tests
    storage: repository code/test paths
    role: implemented behavior and automated proof
relationships:
  - from: decision_build
    to: knowledge_doc
    type: records_changes
  - from: decision_build
    to: roadmap_task
    type: plans_needed_work
  - from: roadmap_task
    to: knowledge_doc
    type: references
  - from: roadmap_task
    to: executable_truth
    type: maps_to
  - from: state_index
    to: resume_context_packet
    type: composes
  - from: roadmap_task
    to: resume_context_packet
    type: seeds
  - from: implementation_build
    to: roadmap_task
    type: closes_or_updates
  - from: implementation_build
    to: executable_truth
    type: evidences
  - from: validation_report
    to: roadmap_task
    type: validates
  - from: validation_report
    to: implementation_build
    type: supports
  - from: state_index
    to: knowledge_doc
    type: derives_from
  - from: state_index
    to: roadmap_task
    type: derives_from
  - from: state_index
    to: decision_build
    type: derives_from
  - from: state_index
    to: implementation_build
    type: derives_from
  - from: state_index
    to: validation_report
    type: derives_from
  - from: state_index
    to: scoped_lease
    type: derives_from
  - from: diagram_spec
    to: knowledge_doc
    type: cites_source
ui_hints:
  default_entities:
    - knowledge_doc
    - roadmap_task
    - implementation_build
    - state_index
  show_storage_paths: true
