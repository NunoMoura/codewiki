schema_version: 1
id: spec.system.diagrams.data-model
title: CodeWiki Data Model
kind: data_model
purpose: Show target data ownership for KB docs, JSONL traces, generated views, runtime tmp, source/tests, and Git proof.
source_docs:
  - .codewiki/kb/system/file-structure.md
  - .codewiki/kb/system/traces.md
renderer:
  preferred: entity_relationship
  fallback: mermaid_flowchart
entities:
  - id: knowledge_doc
    label: Knowledge document
    storage: .codewiki/kb/**/*.md
    truth: true
  - id: trace_file
    label: Trace JSONL file
    storage: .codewiki/traces/TRACE-*.jsonl
    truth: true
  - id: trace_record
    label: Trace record
    storage: one JSON object per trace line
    truth: true
    record_types:
      - trace_head
      - trace_event
      - tail_checkpoint
  - id: generated_view
    label: Generated view
    storage: .codewiki/views/*.json
    truth: false
    examples:
      - status
      - resume
      - work-plan
      - blockers
      - conflicts
  - id: runtime_tmp
    label: Runtime temporary data
    storage: .codewiki/runtime/tmp/<trace-id>/<loop>/**
    truth: false
  - id: source_file
    label: Source/test file
    storage: src/** and tests/**
    truth: true
  - id: git_ref
    label: Git/content proof
    storage: commits, trees, restore refs, publication refs
    truth: true
relationships:
  - from: knowledge_doc
    to: trace_record
    label: referenced by
  - from: trace_file
    to: trace_record
    label: contains
  - from: trace_record
    to: generated_view
    label: projects into
  - from: knowledge_doc
    to: generated_view
    label: supports
  - from: source_file
    to: trace_record
    label: evidence ref
  - from: git_ref
    to: trace_record
    label: content proof
  - from: runtime_tmp
    to: trace_record
    label: promotes durable facts before cleanup
