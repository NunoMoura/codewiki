  - id: traces
    label: JSONL Change Traces
    group: authority_layer
    kind: durable_truth
    source: .codewiki/kb/system/components/traces.md
  - id: source_tests
    label: Source + tests
    group: authority_layer
    kind: executable_truth
  - id: git_delivery
