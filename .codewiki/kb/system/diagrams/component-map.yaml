schema_version: 1
id: spec.system.diagrams.component-map
title: CodeWiki Component and Container Map
kind: component_map
purpose: Show major CodeWiki domain, application, adapter, truth, runtime, view, and proof components with dependency direction.
source_docs:
  - .codewiki/kb/system/overview.md
  - .codewiki/kb/system/loop-model.md
  - .codewiki/kb/system/api-tools.md
  - .codewiki/kb/system/source-map.md
  - .codewiki/kb/system/traces.md
  - .codewiki/kb/system/runtime.md
renderer:
  preferred: layered_graph
  fallback: mermaid_flowchart
groups:
  - id: surfaces
    label: User and host surfaces
  - id: api_layer
    label: Tool/API layer
  - id: runtime_layer
    label: Runtime outer loop
  - id: loop_layer
    label: Semantic loops
  - id: truth_layer
    label: Truth and state
  - id: proof_layer
    label: Proof and retention
nodes:
  - id: user_intent
    label: User / agent intent
    group: surfaces
    kind: actor
  - id: host_adapters
    label: CLI / Pi / MCP adapters
    group: surfaces
    kind: host_adapter
    source: .codewiki/kb/system/api-tools.md
  - id: api
    label: CodeWiki core API
    group: api_layer
    kind: application
    source: .codewiki/kb/system/api.md
  - id: wiki_tools
    label: wiki_state / wiki_decide / wiki_plan / wiki_implement / wiki_archive / wiki_config
    group: api_layer
    kind: tool_surface
    source: .codewiki/kb/system/api-tools.md
  - id: runtime
    label: Runtime outer loop
    group: runtime_layer
    kind: coordination
    source: .codewiki/kb/system/runtime.md
  - id: decision_loop
    label: Decision loop
    group: loop_layer
    kind: semantic_loop
    source: .codewiki/kb/system/decision-loop.md
  - id: planning_loop
    label: Planning loop
    group: loop_layer
    kind: semantic_loop
    source: .codewiki/kb/system/planning-loop.md
  - id: implementation_loop
    label: Implementation loop
    group: loop_layer
    kind: semantic_loop
    source: .codewiki/kb/system/implementation-loop.md
  - id: knowledge
    label: Hot knowledge base
    group: truth_layer
    kind: durable_truth
    source: .codewiki/kb/system/knowledge.md
  - id: traces
    label: JSONL trace truth
    group: truth_layer
    kind: durable_truth
    source: .codewiki/kb/system/traces.md
  - id: views
    label: Generated views
    group: truth_layer
    kind: generated_projection
    source: .codewiki/kb/system/source-map.md
  - id: runtime_tmp
    label: Runtime temp scratch
    group: runtime_layer
    kind: transient_state
    source: .codewiki/kb/system/runtime.md
  - id: code_tests
    label: Source + tests
    group: proof_layer
    kind: executable_truth
  - id: git
    label: Git commits / trees / restore refs
    group: proof_layer
    kind: content_proof
  - id: retention
    label: Retention / archive / hydrate / restore
    group: proof_layer
    kind: retention_pipeline
    source: .codewiki/kb/system/traces.md
edges:
  - from: user_intent
    to: host_adapters
    label: requests work or state
  - from: host_adapters
    to: wiki_tools
    label: exposes tool semantics
  - from: wiki_tools
    to: api
    label: delegates to core APIs
  - from: api
    to: runtime
    label: coordinates next actions
  - from: runtime
    to: decision_loop
    label: runs decision iteration
  - from: runtime
    to: planning_loop
    label: runs planning iteration
  - from: runtime
    to: implementation_loop
    label: runs implementation iteration or workers
  - from: decision_loop
    to: knowledge
    label: updates accepted intent
  - from: decision_loop
    to: traces
    label: appends iteration
  - from: planning_loop
    to: traces
    label: appends iteration
  - from: implementation_loop
    to: traces
    label: appends iteration
  - from: runtime
    to: traces
    label: appends coordination
  - from: runtime
    to: runtime_tmp
    label: stores active scratch
  - from: implementation_loop
    to: code_tests
    label: changes and verifies
  - from: implementation_loop
    to: git
    label: produces content proof
  - from: traces
    to: views
    label: projects current state
  - from: knowledge
    to: views
    label: enriches current state
  - from: git
    to: views
    label: proves closure
  - from: retention
    to: git
    label: stores cold restore refs
  - from: traces
    to: retention
    label: closes and archives
