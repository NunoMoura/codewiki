schema_version: 1
id: spec.system.diagrams.component-map
title: CodeWiki Component and Package Map
kind: component_map
purpose: Show standalone clients, harness-neutral core, Project Runtime, Pi/worker adapters, Loop-owned exit declarations, shared Loop-exit package, authority roots, and derived views.
source_docs:
  - .codewiki/kb/system/components/overview.md
  - .codewiki/kb/system/components/api-tools.md
  - .codewiki/kb/system/components/runtime.md
  - .codewiki/kb/system/components/codewiki-os.md
  - .codewiki/kb/system/components/loop-exit.md
  - .codewiki/kb/system/components/worker-workbench.md
  - .codewiki/kb/system/components/traces.md
renderer:
  preferred: layered_graph
  fallback: mermaid_flowchart
groups:
  - id: client_layer
    label: Clients
  - id: core_layer
    label: Harness-neutral core
  - id: runtime_layer
    label: Project Runtime
  - id: adapter_layer
    label: Execution adapters
  - id: loop_layer
    label: Semantic Loops and owned exit declarations
  - id: authority_layer
    label: Canonical authorities
  - id: derived_layer
    label: Disposable state
nodes:
