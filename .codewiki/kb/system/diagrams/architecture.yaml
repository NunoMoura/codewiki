schema_version: 1
id: spec.system.diagrams.architecture
title: CodeWiki System Architecture
kind: architecture_map
purpose: "Show the target project-scoped control plane, concurrent clients, semantic and worker execution adapters, canonical truth, and generated projections."
source_docs:
  - .codewiki/kb/system/components/overview.md
  - .codewiki/kb/system/components/loop-model.md
  - .codewiki/kb/system/components/codewiki-os.md
  - .codewiki/kb/system/components/quality-policy.md
  - .codewiki/kb/system/components/worker-workbench.md
  - .codewiki/kb/system/components/model-routing.md
  - .codewiki/kb/system/components/runtime.md
  - .codewiki/kb/system/components/session-coordination.md
  - .codewiki/kb/system/components/adapters-and-ui.md
  - .codewiki/kb/system/components/work-state.md
  - .codewiki/kb/system/components/traces.md
renderer:
  preferred: layered_projection
  fallback: mermaid_flowchart
  layout: top_down
  stable_ids: true
groups:
  - id: clients
    label: Project clients
  - id: control
    label: Project control plane
  - id: execution
    label: Execution adapters
  - id: loops
    label: Semantic loops
  - id: truth
    label: Canonical truth
  - id: generated
    label: Disposable projections
  - id: proof
    label: Executable proof
nodes:
  - id: user_agent
    label: User / agent / bounded integration
    group: clients
    kind: actor
  - id: dashboard
    label: Work / Product / System / Design dashboard
    group: clients
    kind: client
    source: .codewiki/kb/product/uis/terminal.md
  - id: pi_client
    label: Pi conversational client
    group: clients
    kind: client_adapter
    source: .codewiki/kb/system/components/extension.md
  - id: future_clients
    label: CLI / MCP / editor / CI clients
    group: clients
    kind: client_adapter
    source: .codewiki/kb/system/components/adapters-and-ui.md
  - id: control_plane
    label: Project control plane
    group: control
    kind: coordination
    source: .codewiki/kb/system/components/runtime.md
  - id: work_state
    label: WorkState projector
    group: control
    kind: generated_projection
    source: .codewiki/kb/system/components/work-state.md
  - id: os_protocols
    label: CodeWiki OS + Stage Protocols
    group: control
    kind: versioned_policy_resource
    source: .codewiki/kb/system/components/codewiki-os.md
  - id: quality_policy
    label: Quality Policy resolver + bounded evaluator
    group: control
    kind: quality_policy
    source: .codewiki/kb/system/components/quality-policy.md
  - id: model_routing
    label: Stage routes + Implementation tier selector
    group: control
    kind: model_routing
    source: .codewiki/kb/system/components/model-routing.md
  - id: semantic_adapter
    label: Embedded Pi SDK semantic sessions
    group: execution
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: worker_workbench
    label: Private Worker Workbench
    group: execution
    kind: transient_execution_environment
    source: .codewiki/kb/system/components/worker-workbench.md
  - id: worker_adapter
    label: Process / container workers
    group: execution
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: decision
    label: Decision loop
    group: loops
    kind: semantic_loop
    source: .codewiki/kb/system/components/decision-loop.md
  - id: planning
    label: Planning loop
    group: loops
    kind: semantic_loop
    source: .codewiki/kb/system/components/planning-loop.md
  - id: implementation
    label: Implementation loop
    group: loops
    kind: semantic_loop
    source: .codewiki/kb/system/components/implementation-loop.md
  - id: kb
    label: OKF Product / System / Design Knowledge
    group: truth
    kind: durable_truth
    source: .codewiki/kb/system/components/knowledge.md
  - id: traces
    label: JSONL Change Traces
    group: truth
    kind: durable_truth
    source: .codewiki/kb/system/components/traces.md
  - id: views
    label: Dashboard / search / graph / activity projections
    group: generated
    kind: generated_projection
    source: .codewiki/kb/system/components/adapters-and-ui.md
  - id: source_git
    label: Source / tests / Git / restore refs
    group: proof
    kind: executable_truth
edges:
  - from: user_agent
    to: dashboard
    label: manages project
  - from: user_agent
    to: pi_client
    label: discusses and submits intent
  - from: dashboard
    to: control_plane
    label: bounded local client requests
  - from: pi_client
    to: control_plane
    label: intent, authority, supervision, reads
  - from: future_clients
    to: control_plane
    label: bounded client protocol
  - from: control_plane
    to: work_state
    label: refreshes canonical projection
  - from: control_plane
    to: os_protocols
    label: binds exact versioned instructions
  - from: control_plane
    to: quality_policy
    label: resolves candidate-specific Standards
  - from: control_plane
    to: model_routing
    label: resolves stage route or Implementation tier
  - from: control_plane
    to: semantic_adapter
    label: schedules bounded read-only jobs
  - from: control_plane
    to: worker_workbench
    label: provisions exact private environment before Claim
  - from: worker_workbench
    to: worker_adapter
    label: activates only under matching Claim
  - from: semantic_adapter
    to: decision
    label: submits Decision candidate
  - from: semantic_adapter
    to: planning
    label: submits Planning candidate
  - from: semantic_adapter
    to: implementation
    label: submits candidate or independent assessment
  - from: planning
    to: worker_workbench
    label: declares Workbench requirements
  - from: model_routing
    to: worker_workbench
    label: binds selected model route
  - from: worker_adapter
    to: implementation
    label: returns candidate realization evidence
  - from: decision
    to: kb
    label: applies accepted intent updates
  - from: decision
    to: traces
    label: accepted append through control plane
  - from: planning
    to: traces
    label: accepted epoch slices through control plane
  - from: quality_policy
    to: decision
    label: governs deterministic exit
  - from: quality_policy
    to: planning
    label: governs deterministic exit
  - from: quality_policy
    to: implementation
    label: governs deterministic exit
  - from: implementation
    to: traces
    label: accepted realization through control plane
  - from: implementation
    to: source_git
    label: verifies integrated content proof
  - from: kb
    to: work_state
    label: canonical context
  - from: traces
    to: work_state
    label: workflow and coordination facts
  - from: source_git
    to: work_state
    label: current implementation and proof
  - from: work_state
    to: views
    label: projects current state
  - from: views
    to: dashboard
    label: state snapshots and events
  - from: views
    to: pi_client
    label: compact state and notifications
