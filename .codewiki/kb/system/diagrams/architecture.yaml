schema_version: 1
id: spec.system.diagrams.architecture
title: CodeWiki Intent-to-Production Architecture
kind: architecture_map
purpose: Show bounded multi-source Change intake, explainable Backlog triage, log-canonical Change operations, provider-neutral Git acceptance, deterministic WorkState and Alignment Graph projection, rolling Planning, exactly three semantic Loops, isolated execution, archive, and guarded effects.
