schema_version: 1
id: spec.system.diagrams.architecture
title: CodeWiki Intent-to-Production Architecture
kind: architecture_map
purpose: Show standalone clients, Project Runtime, Pi-owned execution, exactly three semantic Loops, candidate-bound exit, canonical truth, derived views, and guarded delivery boundaries.
source_docs:
  - .codewiki/kb/product/overview.md
  - .codewiki/kb/system/components/overview.md
  - .codewiki/kb/system/components/loop-model.md
  - .codewiki/kb/system/components/codewiki-os.md
  - .codewiki/kb/system/components/loop-exit.md
  - .codewiki/kb/system/components/worker-workbench.md
  - .codewiki/kb/system/components/model-routing.md
  - .codewiki/kb/system/components/runtime.md
  - .codewiki/kb/system/components/work-state.md
  - .codewiki/kb/system/components/traces.md
renderer:
  preferred: layered_projection
  fallback: mermaid_flowchart
  layout: top_down
  stable_ids: true
groups:
  - id: clients
    label: Product clients
  - id: runtime
    label: CodeWiki Project Runtime
  - id: execution
    label: Pi and worker execution
  - id: loops
    label: Semantic Loops
  - id: truth
    label: Canonical authorities
  - id: derived
    label: Disposable projections
  - id: effects
    label: Guarded delivery boundaries
nodes:
  - id: user_agent
    label: User / agent / bounded integration
    group: clients
    kind: actor
  - id: cli
    label: Standalone CodeWiki CLI
    group: clients
    kind: client
    source: README.md
  - id: dashboard
    label: Work / Product / System / Design dashboard
    group: clients
    kind: client
    source: .codewiki/kb/product/uis/terminal.md
  - id: pi_client
    label: Optional thin Pi conversational client
    group: clients
    kind: client_adapter
    source: .codewiki/kb/system/components/extension.md
  - id: project_runtime
    label: Project Runtime
    group: runtime
    kind: coordination
    source: .codewiki/kb/system/components/runtime.md
  - id: work_state
    label: WorkState + relationship projector
    group: runtime
    kind: generated_projection
    source: .codewiki/kb/system/components/work-state.md
  - id: protocols
    label: CodeWiki OS + Loop Protocols
    group: runtime
    kind: versioned_policy_resource
    source: .codewiki/kb/system/components/codewiki-os.md
  - id: loop_exit
    label: Candidate identity + Exit Policy + Check runner + Exit Report
    group: runtime
    kind: loop_exit_runtime
    source: .codewiki/kb/system/components/loop-exit.md
  - id: model_routing
    label: Loop routes + Implementation tier selector
    group: runtime
    kind: model_routing
    source: .codewiki/kb/system/components/model-routing.md
  - id: pi_sdk
    label: Published Pi SDK semantic / Model Check sessions
    group: execution
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: workbench
    label: Private Worker Workbench
    group: execution
    kind: transient_execution_environment
    source: .codewiki/kb/system/components/worker-workbench.md
  - id: workers
    label: Isolated process / OCI workers
    group: execution
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: decision
    label: Decision Loop
    group: loops
    kind: semantic_loop
    source: .codewiki/kb/system/components/decision-loop.md
  - id: planning
    label: Planning Loop
    group: loops
    kind: semantic_loop
    source: .codewiki/kb/system/components/planning-loop.md
  - id: implementation
    label: Implementation Loop
    group: loops
    kind: semantic_loop
    source: .codewiki/kb/system/components/implementation-loop.md
  - id: knowledge
    label: OKF Product / System / Design Knowledge
    group: truth
    kind: durable_truth
    source: .codewiki/kb/system/components/knowledge.md
  - id: traces
    label: JSONL Change Traces
    group: truth
    kind: durable_truth
    source: .codewiki/kb/system/components/traces.md
  - id: source_tests
    label: Source + tests
    group: truth
    kind: executable_truth
  - id: git
    label: Git commits / trees / refs
    group: truth
    kind: content_proof
  - id: views
    label: Work / Alignment / Learning / dashboard views
    group: derived
    kind: generated_projection
    source: .codewiki/kb/system/components/work-state.md
  - id: delivery
    label: Merge / push / publication / release / observation
    group: effects
    kind: guarded_effects
    source: .codewiki/kb/system/components/runtime.md
edges:
  - from: user_agent
    to: cli
    label: operates project
  - from: user_agent
    to: dashboard
    label: manages and inspects
  - from: user_agent
    to: pi_client
    label: discusses intent and authority
  - from: cli
    to: project_runtime
    label: authenticated bounded requests
  - from: dashboard
    to: project_runtime
    label: authenticated bounded requests
  - from: pi_client
    to: project_runtime
    label: intent / authority / supervision / reads
  - from: project_runtime
    to: work_state
    label: refreshes exact project snapshot
  - from: project_runtime
    to: protocols
    label: binds versioned guidance
  - from: project_runtime
    to: model_routing
    label: selects exact route and tier
  - from: project_runtime
    to: pi_sdk
    label: starts bounded candidate or Model Check sessions
  - from: project_runtime
    to: workbench
    label: provisions before Claim
  - from: workbench
    to: workers
    label: activates under exact Claim
  - from: pi_sdk
    to: decision
    label: proposes Decision candidate
  - from: pi_sdk
    to: planning
    label: proposes Planning candidate
  - from: pi_sdk
    to: implementation
    label: proposes candidate or Check output
  - from: planning
    to: workbench
    label: declares worker-ready requirements
  - from: workers
    to: implementation
    label: returns immutable Worker Report evidence
  - from: decision
    to: loop_exit
    label: exact candidate
  - from: planning
    to: loop_exit
    label: exact candidate
  - from: implementation
    to: loop_exit
    label: exact candidate
  - from: loop_exit
    to: project_runtime
    label: immutable Exit Report
  - from: project_runtime
    to: traces
    label: guarded append
  - from: decision
    to: knowledge
    label: accepted meaning update through Runtime
  - from: implementation
    to: source_tests
    label: realizes accepted obligations
  - from: source_tests
    to: git
    label: exact candidate tree
  - from: knowledge
    to: work_state
    label: canonical intent
  - from: traces
    to: work_state
    label: canonical progression and evidence
  - from: source_tests
    to: work_state
    label: executable state
  - from: git
    to: work_state
    label: exact content proof
  - from: work_state
    to: views
    label: bounded derived projections
  - from: views
    to: cli
    label: status and queries
  - from: views
    to: dashboard
    label: state and relationship views
  - from: views
    to: pi_client
    label: compact state and notifications
  - from: project_runtime
    to: delivery
    label: separately authorizes exact effects
  - from: delivery
    to: work_state
    label: bounded observations and proofs
