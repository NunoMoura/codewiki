      - tests/smoke/package-smoke.test.mjs
    removed_paths:
      - src/domain/roadmap/types.ts
      - src/domain/roadmap/status.ts
      - src/domain/roadmap/task-id.ts
      - src/domain/roadmap/task-boundary.ts
      - src/application/roadmap.ts
      - src/application/task.ts
      - src/application/tools/task.ts
  - id: runtime_orchestration_boundary
    label: Runtime orchestration concept root
    group: source_target
    kind: component
    source: .codewiki/kb/system/runtime.md
    requires_doc: true
    status: implementation_in_progress_by_task_047
    task_id: TASK-047
    paths:
      - src/runtime/**
      - tests/smoke/runtime-runner.test.mjs
      - tests/tasks/TASK-015/agency-source-root.test.mjs
  - id: state_graph_resume_concept_root_boundary
    label: State, graph, prompt, and resume-context concept-root migration
    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: implementation_in_progress_by_task_030
    task_id: TASK-030
    cleanup_state: old_state_graph_resume_paths_removed
    paths:
      - src/state/**
      - tests/tasks/TASK-030/state-graph-resume-source-root.test.mjs
