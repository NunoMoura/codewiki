schema_version: 1
id: spec.system.diagrams.file-structure-map
title: CodeWiki File Structure and Ownership Map
kind: file_structure_map
purpose: "Show the target rebuild source layout and CodeWiki state roots: KB truth, JSONL trace truth, generated views, runtime tmp, and archived old implementation."
source_docs:
  - .codewiki/kb/system/file-structure.md
  - .codewiki/kb/system/traces.md
renderer:
  preferred: tree_projection
  fallback: mermaid_flowchart
groups:
  - id: repo
    label: Repository root
  - id: source
    label: Active source
  - id: codewiki
    label: CodeWiki state
  - id: archive
    label: Migration archive
nodes:
  - id: repo_root
    label: Repository root
    group: repo
    kind: root
    paths:
      - README.md
      - package.json
      - package-lock.json
      - tsconfig.json
      - CHANGELOG.md
      - LICENSE
  - id: source_roots
    label: Target src roots
    group: source
    kind: source_layout
    source: .codewiki/kb/system/file-structure.md
    paths:
      - src/api/**
      - src/decision/**
      - src/planning/**
      - src/implementation/**
      - src/traces/**
      - src/views/**
      - src/knowledge/**
      - src/git/**
      - src/runtime/**
      - src/pi/**
      - src/project/**
      - src/utils/**
  - id: test_roots
    label: Target tests
    group: source
    kind: test_layout
    paths:
      - tests/decision/**
      - tests/planning/**
      - tests/implementation/**
      - tests/traces/**
      - tests/views/**
      - tests/runtime/**
      - tests/pi/**
      - tests/shared/**
  - id: kb_truth
    label: Knowledge truth
    group: codewiki
    kind: durable_truth
    source: .codewiki/kb/system/file-structure.md
    paths:
      - .codewiki/kb/**
  - id: trace_truth
    label: JSONL trace truth
    group: codewiki
    kind: durable_truth
    source: .codewiki/kb/system/traces.md
    target_paths:
      - .codewiki/traces/TRACE-*.jsonl
  - id: generated_views
    label: Generated views
    group: codewiki
    kind: generated_projection
    source: .codewiki/kb/system/file-structure.md
    target_paths:
      - .codewiki/views/status.json
      - .codewiki/views/resume.json
      - .codewiki/views/work-plan.json
      - .codewiki/views/blockers.json
      - .codewiki/views/conflicts.json
  - id: runtime_tmp
    label: Runtime temporary data
    group: codewiki
    kind: transient_state
    source: .codewiki/kb/system/file-structure.md
    target_paths:
      - .codewiki/runtime/tmp/<trace-id>/<loop>/**
  - id: old_version
    label: Archived previous implementation
    group: archive
    kind: migration_reference
    paths:
      - _OLD_VERSION/**
edges:
  - from: source_roots
    to: trace_truth
    label: emits trace records
  - from: trace_truth
    to: generated_views
    label: projects to
  - from: kb_truth
    to: generated_views
    label: supports projections
  - from: runtime_tmp
    to: trace_truth
    label: promotes durable facts before cleanup
  - from: old_version
    to: source_roots
    label: migrates into, one module at a time
