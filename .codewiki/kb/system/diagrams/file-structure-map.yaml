    requires_doc: true
    status: task_close_validated_by_task_022
    task_id: TASK-022
    validation_ref: .codewiki/validation/2026-05-26-task-close-pass-task-022.json
    cleanup_state: old_build_validation_gateway_paths_removed
    paths:
      - src/build/**
      - src/validation/**
      - src/gateway/**
      - tests/tasks/TASK-022/**
    removed_paths:
