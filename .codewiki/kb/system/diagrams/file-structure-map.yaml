  - id: gc_concept_root_boundary
    label: GC concept-root migration
    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: task_close_validated_by_task_027
    task_id: TASK-027
    validation_ref: .codewiki/validation/2026-05-26-task-close-pass-task-027.json
    cleanup_state: old_gc_paths_removed
    paths:
      - src/gc/**
      - tests/tasks/TASK-027/gc-source-root.test.mjs
      - tests/smoke/hot-retention.test.mjs
      - tests/smoke/package-smoke.test.mjs
    removed_paths:
      - src/domain/gc/types.ts
      - src/application/gc.ts
