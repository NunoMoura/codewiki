schema_version: 1
id: spec.system.diagrams.file-structure-map
title: CodeWiki File Structure and Ownership Map
kind: file_structure_map
purpose: Show intended repository/source ownership, current implementation shape, approved migration deltas, and drift categories for human-driven structure control.
source_docs:
  - .codewiki/kb/system/file-structure.md
  - .codewiki/kb/system/overview.md
renderer:
  preferred: tree_graph
  fallback: mermaid_flowchart
groups:
  - id: root
    label: Repository root
  - id: source_current
    label: Current source layout
  - id: source_target
    label: Loop-first source target
  - id: exposure
    label: Exposure layers
  - id: codewiki_state
    label: Dogfood CodeWiki state
  - id: generated_runtime
    label: Generated and runtime artifacts
  - id: assets_tests
    label: Skills, tests, and helpers
  - id: proof
    label: Content evidence and publication
  - id: drift
    label: Drift and delta controls
nodes:
  - id: intended_file_structure
    label: Intended file structure
    group: root
    kind: policy
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    role: canonical_target
  - id: current_layered_source
    label: Current concept-root src layout
    group: source_current
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: concept_root_validated
    summary: Current source tree is represented by individual concept-root owner nodes.
  - id: current_adapters
    label: Current adapters
    group: exposure
    kind: adapter
    source: .codewiki/kb/system/adapters.md
    paths:
      - src/adapters/**
  - id: current_ui
    label: Current UI
    group: exposure
    kind: component
    source: .codewiki/kb/system/terminal-ui.md
    note: Pi-hosted status/config panels live inside the Pi adapter path and are owned by current_adapters for strict file-structure purposes.
  - id: concept_root_target
    label: Loop-first source ownership target
    group: source_target
    kind: policy
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: accepted_target
    paths:
      - src/api/**
      - src/decision/**
      - src/planning/**
      - src/implementation/**
      - src/telemetry/**
      - src/graph/**
      - src/knowledge/**
      - src/git/**
      - src/pi/**
      - src/project/**
      - src/runtime/**
      - src/agency/**
      - src/shared/**
    compatibility_paths:
      - src/adapters/pi/**
      - src/audit/**
      - src/build/**
      - src/checks/**
      - src/gc/**
      - src/gateway/**
      - src/policy/**
      - src/roadmap/**
      - src/session/**
      - src/state/**
      - src/workflow/**
    former_compatibility_paths:
      - src/change/**
      - src/validation/**
    trigger: TASK-109 removed absent src/change/** from compatibility exports and TASK-105 removed absent src/validation/**; do not recreate either without a future accepted migration.
  - id: first_concept_root_pilot
    label: Agency concept-root pilot
    group: source_target
    kind: policy
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: implemented_pilot_validated
    paths:
      - src/agency/**
      - tests/tasks/TASK-015/agency-source-root.test.mjs
    former_compatibility_paths:
      - src/domain/agency/types.ts
      - src/application/agency.ts
      - src/application/tools/agency.ts
  - id: agency_shim_cleanup_boundary
    label: Agency shim cleanup follow-up
    group: drift
    kind: policy
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: cleanup_validated_by_task_020
    task_id: TASK-020
    cleanup_state: shims_removed
    removed_paths:
      - src/domain/agency/types.ts
      - src/application/agency.ts
      - src/application/tools/agency.ts
    paths:
      - src/agency/**
      - tests/tasks/TASK-015/agency-source-root.test.mjs
      - tests/smoke/package-smoke.test.mjs
  - id: audit_concept_root_boundary
    label: Audit facade concept-root migration
    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: task_close_validated_by_task_021
    task_id: TASK-021
    validation_ref: .codewiki/validation/2026-05-25-task-close-pass-task-021.json
    cleanup_state: old_audit_paths_removed
    paths:
      - src/audit/**
      - tests/tasks/TASK-021/audit-source-root.test.mjs
      - tests/smoke/package-smoke.test.mjs
    removed_paths:
      - src/domain/audit/types.ts
      - src/application/tools/audit.ts
  - id: checks_concept_root_boundary
    label: Deterministic checks concept-root boundary
    group: source_target
    kind: component
    source: .codewiki/kb/system/audits.md
    requires_doc: true
    status: implementation_in_progress_by_task_051
    task_id: TASK-051
    paths:
      - src/checks/**
      - tests/smoke/horizontal-alignment.test.mjs
  - id: build_validation_gateway_wave
