    requires_doc: true
    status: gateway_ownership_updated_by_task_058
    task_id: TASK-058
    prior_validation_ref: .codewiki/validation/2026-05-26-task-close-pass-task-022.json
    cleanup_state: old_build_validation_gateway_paths_removed
    paths:
