    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: task_close_validated_by_task_028
    task_id: TASK-028
    validation_ref: .codewiki/validation/2026-05-27-task-close-pass-task-028.json
    cleanup_state: old_session_claim_worktree_paths_removed
    paths:
      - src/session/**
      - tests/tasks/TASK-028/session-source-root.test.mjs
      - tests/smoke/claim-wait-queue.test.mjs
      - tests/smoke/loop-isolation-policy.test.mjs
      - tests/smoke/role-worktree-isolation.test.mjs
