    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: task_close_validated_by_task_026
    task_id: TASK-026
    validation_ref: .codewiki/validation/2026-05-26-task-close-pass-task-026.json
    cleanup_state: old_change_diff_table_paths_removed
    paths:
      - src/change/**
      - tests/tasks/TASK-026/change-diff-table-source-root.test.mjs
      - tests/smoke/builds.test.mjs
