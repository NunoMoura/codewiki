      - tests/smoke/alignment-drift-fixtures.test.mjs
    removed_paths:
      - src/application/knowledge/doc-parser.ts
      - src/application/knowledge/diagram-parser.ts
  - id: decision_loop_source_boundary
    label: Decision loop source-root migration
    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: implementation_in_progress_by_task_109
    task_id: TASK-109
    prior_task_id: TASK-026
    prior_validation_ref: .codewiki/validation/2026-05-26-task-close-pass-task-026.json
    cleanup_state: src_change_removed
    paths:
      - src/decision/**
      - tests/tasks/TASK-109/decision-root-migration.test.mjs
      - tests/smoke/decision-approval-ui.test.mjs
      - tests/smoke/efficiency-ui.test.mjs
      - tests/smoke/package-smoke.test.mjs
