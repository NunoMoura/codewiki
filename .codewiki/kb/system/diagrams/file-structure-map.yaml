schema_version: 1
id: spec.system.diagrams.file-structure-map
title: CodeWiki File Structure and Ownership Map
kind: file_structure_map
purpose: "Show the target rebuild source layout and CodeWiki state roots: KB truth, JSONL trace truth, generated views, runtime tmp, and archived old implementation."
source_docs:
  - .codewiki/kb/system/file-structure.md
  - .codewiki/kb/system/source-map.md
  - .codewiki/kb/system/traces.md
renderer:
  preferred: tree_projection
  fallback: mermaid_flowchart
groups:
  - id: repo
    label: Repository root
  - id: source
    label: Active source
  - id: codewiki
    label: CodeWiki state
  - id: archive
    label: Migration archive
nodes:
  - id: repo_root
    label: Repository root
    group: repo
    kind: root
    paths:
      - README.md
      - package.json
      - package-lock.json
      - tsconfig.json
      - CHANGELOG.md
      - LICENSE
  - id: source_roots
    label: Target src roots
    group: source
    kind: source_layout
    source: .codewiki/kb/system/file-structure.md
    paths:
      - src/api/**
      - src/decision/**
      - src/planning/**
      - src/implementation/**
      - src/traces/**
      - src/views/**
      - src/knowledge/**
      - src/git/**
      - src/runtime/**
      - src/pi/**
      - src/project/**
      - src/utils/**
  - id: component.decision
    label: Decision loop output and exit conditions
    group: source
    kind: component
    kb_refs:
      - .codewiki/kb/system/decision-loop.md
      - .codewiki/kb/system/loop-model.md
      - .codewiki/kb/system/loop-contracts.md
    paths:
      - src/decision/**
      - src/api/decision.ts
    test_paths:
      - tests/decision/**
      - tests/helpers/decision-row.mjs
  - id: component.planning
    label: Planning loop output and exit conditions
    group: source
    kind: component
    kb_refs:
      - .codewiki/kb/system/planning-loop.md
      - .codewiki/kb/system/loop-model.md
      - .codewiki/kb/system/loop-contracts.md
    paths:
      - src/planning/**
      - src/api/planning.ts
    test_paths:
      - tests/planning/**
  - id: component.implementation
    label: Implementation loop output and exit conditions
    group: source
    kind: component
    kb_refs:
      - .codewiki/kb/system/implementation-loop.md
      - .codewiki/kb/system/loop-model.md
      - .codewiki/kb/system/loop-contracts.md
    paths:
      - src/implementation/**
      - src/api/implementation.ts
    test_paths:
      - tests/implementation/**
  - id: component.traces
    label: JSONL traces and recovery spine
    group: source
    kind: component
    kb_refs:
      - .codewiki/kb/system/traces.md
      - .codewiki/kb/system/loop-contracts.md
    paths:
      - src/traces/**
      - src/api/traces.ts
    test_paths:
      - tests/traces/**
  - id: component.git
    label: Git content proof and worktree isolation
    group: source
    kind: component
    kb_refs:
      - .codewiki/kb/system/implementation-loop.md
      - .codewiki/kb/system/worktree-isolation.md
    paths:
      - src/git/**
    test_paths:
      - tests/implementation/**
      - tests/runtime/git-status.test.mjs
      - tests/runtime/worktrees.test.mjs
  - id: component.views
    label: Trace-backed projections and views
    group: source
    kind: component
    kb_refs:
      - .codewiki/kb/system/traces.md
      - .codewiki/kb/system/file-structure.md
    paths:
      - src/views/**
      - src/api/views.ts
    test_paths:
      - tests/views/**
  - id: component.knowledge
    label: Knowledge parsing and file-structure contracts
    group: source
    kind: component
    kb_refs:
      - .codewiki/kb/system/file-structure.md
      - .codewiki/kb/system/diagrams/file-structure-map.yaml
    paths:
      - src/knowledge/**
      - .codewiki/kb/**
      - .agents/skills/**
    test_paths:
      - tests/knowledge/**
      - tests/shared/**
      - tests/scaffold.test.mjs
  - id: component.runtime
    label: Runtime boundaries, claims, and project helpers
    group: source
    kind: component
    kb_refs:
      - .codewiki/kb/system/file-structure.md
      - .codewiki/kb/system/traces.md
    paths:
      - src/runtime/**
      - src/project/**
      - src/pi/**
    test_paths:
      - tests/runtime/**
      - tests/pi/**
      - tests/scaffold.test.mjs
  - id: test_roots
    label: Target tests
    group: source
    kind: test_layout
    paths:
      - tests/decision/**
      - tests/planning/**
      - tests/implementation/**
      - tests/traces/**
      - tests/views/**
      - tests/runtime/**
      - tests/pi/**
      - tests/shared/**
  - id: kb_truth
    label: Knowledge truth
    group: codewiki
    kind: durable_truth
    source: .codewiki/kb/system/file-structure.md
    paths:
      - .codewiki/kb/**
  - id: trace_truth
    label: JSONL trace truth
    group: codewiki
    kind: durable_truth
    source: .codewiki/kb/system/traces.md
    target_paths:
      - .codewiki/traces/TRACE-*.jsonl
  - id: generated_views
    label: Generated views
    group: codewiki
    kind: generated_projection
    source: .codewiki/kb/system/file-structure.md
    target_paths:
      - .codewiki/views/status.json
      - .codewiki/views/resume.json
      - .codewiki/views/work-plan.json
      - .codewiki/views/work-queue.json
      - .codewiki/views/quality.json
      - .codewiki/views/blockers.json
      - .codewiki/views/conflicts.json
  - id: runtime_tmp
    label: Runtime temporary data
    group: codewiki
    kind: transient_state
    source: .codewiki/kb/system/file-structure.md
    target_paths:
      - .codewiki/runtime/tmp/<trace-id>/<loop>/**
  - id: old_version
    label: Archived previous implementation
    group: archive
    kind: migration_reference
    paths:
      - _OLD_VERSION/**
edges:
  - from: source_roots
    to: trace_truth
    label: emits trace records
  - from: trace_truth
    to: generated_views
    label: projects to
  - from: kb_truth
    to: generated_views
    label: supports projections
  - from: runtime_tmp
    to: trace_truth
    label: promotes durable facts before cleanup
  - from: old_version
    to: source_roots
    label: migrates into, one module at a time
