      - src/application/session.ts
      - src/application/claims.ts
      - src/application/worktree-isolation.ts
      - src/application/tools/session.ts
      - src/application/tools/artifact-status.ts
  - id: roadmap_concept_root_boundary
    label: Roadmap/task concept-root migration
    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: task_close_validated_by_task_029
    task_id: TASK-029
    validation_ref: .codewiki/validation/2026-05-27-task-close-pass-task-029.json
    cleanup_state: old_roadmap_task_paths_removed
    paths:
      - src/roadmap/**
      - tests/tasks/TASK-029/roadmap-source-root.test.mjs
      - tests/smoke/roadmap-task-boundary.test.mjs
      - tests/smoke/package-smoke.test.mjs
    removed_paths:
      - src/domain/roadmap/types.ts
