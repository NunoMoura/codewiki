      - src/domain/validation/**
      - src/application/builds.ts
      - src/application/tools/build.ts
      - src/application/tools/validation.ts
      - src/application/gateway/**
    trigger: TASK-105 classifies absent src/validation/** as removed gateway compatibility, not a required current export.
  - id: project_concept_root_boundary
    label: Project/bootstrap concept-root migration
    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: task_close_validated_by_task_024
    task_id: TASK-024
    validation_ref: .codewiki/validation/2026-05-26-task-close-pass-task-024.json
    cleanup_state: old_project_bootstrap_paths_removed
    paths:
      - src/project/**
      - tests/tasks/TASK-024/project-source-root.test.mjs
      - tests/smoke/package-smoke.test.mjs
    removed_paths:
      - src/domain/project/types.ts
      - src/application/project.ts
      - src/application/local/filesystem.ts
      - src/application/local/file-store.ts
      - src/application/local/git-cache.ts
      - src/application/tools/bootstrap.ts
      - src/bootstrap.ts
      - src/project-root.ts
      - src/templates.ts
  - id: policy_gate_boundary
    label: Gate policy boundary
    group: source_target
    kind: component
    source: .codewiki/kb/system/validation-gateway.md
    requires_doc: true
    status: implemented_by_task_057
    task_id: TASK-057
    paths:
      - src/policy/**
      - tests/smoke/policy-gate.test.mjs
    removed_paths:
      - src/quality/**
      - tests/smoke/quality-profile.test.mjs
  - id: knowledge_concept_root_boundary
    label: Knowledge parser concept-root migration
    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: task_close_validated_by_task_025
    task_id: TASK-025
    validation_ref: .codewiki/validation/2026-05-26-task-close-pass-task-025.json
    cleanup_state: old_knowledge_parser_paths_removed
    paths:
      - src/knowledge/**
      - tests/tasks/TASK-025/knowledge-source-root.test.mjs
