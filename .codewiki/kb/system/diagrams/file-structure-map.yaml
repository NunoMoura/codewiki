      - src/application/rebuild.ts
      - src/application/graph.ts
      - src/application/graph/rebuilder.ts
      - src/application/lint.ts
      - src/application/resume-context.ts
      - src/application/prompt.ts
      - src/application/skill-assets.ts
      - src/application/local/rebuild-runner.ts
      - src/application/local/status-dock-prefs.ts
      - src/application/tools/state.ts
      - src/application/tools/resume-context.ts
  - id: api_facade
    label: Stable API facade
    group: source_target
    kind: component
    source: .codewiki/kb/system/api.md
    status: accepted_target
    paths:
      - src/api/**
  - id: shared_primitives
    label: Shared primitives only
    group: source_target
    kind: component
    source: .codewiki/kb/system/file-structure.md
    status: accepted_target
    paths:
      - src/shared/**
  - id: dogfood_kb
    label: Dogfood knowledge base
    group: codewiki_state
    kind: durable_truth
    source: .codewiki/kb/system/knowledge.md
    paths:
      - .codewiki/kb/**
  - id: dogfood_roadmap
    label: Roadmap work truth
    group: codewiki_state
    kind: durable_truth
    source: .codewiki/kb/system/roadmap.md
    paths:
      - .codewiki/roadmap/queue.json
  - id: dogfood_builds
    label: Compiler builds
    group: codewiki_state
    kind: artifact
    source: .codewiki/kb/system/builds.md
    paths:
      - .codewiki/builds/**
  - id: dogfood_validation
    label: Validation reports
    group: proof
    kind: evidence
    source: .codewiki/kb/system/validation-gateway.md
    paths:
      - .codewiki/validation/**
  - id: generated_graph
    label: Generated graph/state views
    group: generated_runtime
    kind: generated_state
    source: .codewiki/kb/system/graph.md
    paths:
      - .codewiki/index_graph.json
      - .codewiki/roadmap/tasks/**
  - id: runtime_session
    label: Dogfood runtime/session coordination
    group: generated_runtime
    kind: artifact
    source: .codewiki/kb/system/api.md
    paths:
      - .codewiki/session/**
      - .codewiki/runtime/**
  - id: skills_assets
    label: Skill workflow assets
    group: assets_tests
    kind: component
    source: .codewiki/kb/system/extension.md
    paths:
      - skills/codewiki/**
      - skills/codewiki-decision/**
      - skills/codewiki-planning/**
      - skills/codewiki-implementation/**
      - skills/codewiki-validation/**
  - id: tests_and_smoke
    label: Tests and smoke baselines
    group: assets_tests
    kind: executable_truth
    source: .codewiki/kb/system/file-structure.md
    paths:
      - tests/**
  - id: optional_scripts
    label: Optional developer helper scripts
    group: assets_tests
    kind: component
    source: .codewiki/kb/system/file-structure.md
    paths:
      - scripts/**
    rule: removable_without_product_semantic_change
  - id: publication_proof
    label: Publication proof
    group: proof
    kind: publication
    source: .codewiki/kb/system/overview.md
    paths:
      - git commits and tree SHAs
      - package digests
      - archive refs
      - remote refs
  - id: structure_drift_lens
    label: Intended vs current structure drift lens
    group: drift
    kind: policy
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: accepted_target
    categories:
      - missing_expected_path
      - unexpected_path
      - ownership_mismatch
      - deprecated_path_present
      - generated_or_runtime_artifact_in_source_area
      - approved_migration_delta
      - compatibility_export_gap
  - id: human_structure_surface
    label: Human structure review surface
    group: drift
    kind: component
    source: .codewiki/kb/product/overview.md
    status: accepted_target
  - id: migration_compatibility_constraints
    label: Migration compatibility constraints
    group: drift
    kind: policy
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: required_for_migration
    constraints:
      - preserve_public_package_behavior
      - preserve_package_entrypoints
      - preserve_adapter_schema_and_tool_behavior
      - preserve_direct_node_execution
      - preserve_package_loading
      - require_typecheck_smoke_feature_package_checks
      - keep_compatibility_shims_test_backed_and_temporary
  - id: deferred_concept_roots
    label: Remaining concept-root migration cohort
    group: drift
    kind: policy
    source: .codewiki/kb/system/file-structure.md
    requires_doc: true
    status: completed
    defer_status: satisfied
    owner: maintainers
    trigger: TASK-022 build/validation/gateway migration task-close validation and file-structure audit evidence
    trigger_state: satisfied_by_remaining_concept_root_tasks_TASK-024_through_TASK-031
    next_boundary: none
    active_boundary: none
    completed_boundaries:
      - TASK-024_project_root_migration_task_close_validated
      - TASK-025_knowledge_parser_migration_task_close_validated
      - TASK-026_change_diff_table_migration_task_close_validated
      - TASK-027_gc_migration_task_close_validated
      - TASK-028_session_migration_task_close_validated
      - TASK-029_roadmap_migration_task_close_validated
      - TASK-030_state_graph_resume_migration_task_close_validated
      - TASK-031_api_shared_cleanup_validated
    downstream_deferred_until: complete
edges:
  - id: intended_defines_current
    from: intended_file_structure
    to: current_layered_source
    label: records current implementation shape
  - id: intended_defines_target
    from: intended_file_structure
    to: concept_root_target
    label: defines accepted target ownership
  - id: current_to_target_delta
    from: current_layered_source
    to: concept_root_target
    label: concept-root layout matches accepted target
  - id: agency_selected_first
    from: concept_root_target
    to: first_concept_root_pilot
    label: first approved migration boundary
  - id: runtime_root_added
    from: concept_root_target
    to: runtime_orchestration_boundary
    label: approved runtime orchestration root
  - id: pilot_uses_compatibility_constraints
    from: migration_compatibility_constraints
    to: first_concept_root_pilot
    label: gates source move
  - id: heavy_roots_wait_for_pilot
    from: deferred_concept_roots
    to: first_concept_root_pilot
    label: original deferral trigger satisfied by pilot evidence
  - id: agency_cleanup_follows_pilot
    from: first_concept_root_pilot
    to: agency_shim_cleanup_boundary
    label: selected post-pilot cleanup boundary
  - id: heavy_roots_wait_for_cleanup
    from: deferred_concept_roots
    to: agency_shim_cleanup_boundary
    label: renewed deferral until cleanup validation
  - id: audit_selected_after_cleanup
    from: concept_root_target
    to: audit_concept_root_boundary
    label: selected migration boundary after agency cleanup
  - id: audit_uses_compatibility_constraints
    from: migration_compatibility_constraints
    to: audit_concept_root_boundary
    label: gates audit source move
  - id: heavier_roots_wait_for_audit
    from: deferred_concept_roots
    to: audit_concept_root_boundary
    label: previous deferral gate satisfied by audit task-close validation
  - id: build_validation_wave_selected_after_audit
    from: concept_root_target
    to: build_validation_gateway_wave
    label: next approved migration wave after audit validation
  - id: build_validation_wave_uses_compatibility_constraints
    from: migration_compatibility_constraints
    to: build_validation_gateway_wave
    label: gates build/validation/gateway source move
  - id: heavier_roots_wait_for_build_validation
    from: deferred_concept_roots
    to: build_validation_gateway_wave
    label: current deferral gate waits for TASK-022 task-close validation
  - id: project_selected_after_build_validation
    from: concept_root_target
    to: project_concept_root_boundary
    label: selected TASK-024 project/bootstrap migration boundary
  - id: project_uses_compatibility_constraints
    from: migration_compatibility_constraints
    to: project_concept_root_boundary
    label: gates project source move
  - id: knowledge_selected_after_project
    from: concept_root_target
    to: knowledge_concept_root_boundary
    label: selected TASK-025 knowledge parser migration boundary
  - id: knowledge_uses_compatibility_constraints
    from: migration_compatibility_constraints
    to: knowledge_concept_root_boundary
    label: gates knowledge parser source move
  - id: concept_target_exposed_by_api
    from: concept_root_target
    to: api_facade
    label: exposes stable tool/API contracts
  - id: adapters_delegate_to_api
    from: current_adapters
    to: api_facade
    label: delegate semantic work
  - id: ui_delegates_to_api
    from: current_ui
    to: api_facade
    label: delegates semantic work
  - id: drift_lens_compares
    from: structure_drift_lens
    to: current_layered_source
    label: compares current tree
  - id: drift_lens_against_target
    from: structure_drift_lens
    to: concept_root_target
    label: against intended target
  - id: human_surface_reads_drift
    from: human_structure_surface
    to: structure_drift_lens
    label: presents drift and approved deltas
  - id: kb_owns_intent
    from: dogfood_kb
    to: intended_file_structure
    label: owns source truth
  - id: roadmap_plans_migration
    from: dogfood_roadmap
    to: concept_root_target
    label: plans executable migration
  - id: builds_record_handoffs
    from: dogfood_builds
    to: concept_root_target
    label: compile handoffs for migration
  - id: validation_checks_migration
    from: dogfood_validation
    to: structure_drift_lens
    label: validates evidence and drift policy
  - id: graph_indexes_structure
    from: generated_graph
    to: structure_drift_lens
    label: indexes refs and audit results
  - id: runtime_not_truth
    from: runtime_session
    to: intended_file_structure
    label: coordinates but does not define truth
  - id: tests_prove_source
    from: tests_and_smoke
    to: concept_root_target
    label: proves behavior through migration
ui_hints:
  default_layout: tree_with_delta_overlay
  edge_style: behind_nodes
  inspector_fields:
    - kind
    - source
    - group
    - status
    - paths
    - categories
