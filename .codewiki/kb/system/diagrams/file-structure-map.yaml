      - src/application/tools/audit.ts
  - id: checks_concept_root_boundary
    label: Deterministic checks concept-root boundary
    group: source_target
    kind: component
    source: .codewiki/kb/system/audits.md
    requires_doc: true
    status: implementation_in_progress_by_task_051
    task_id: TASK-051
    paths:
      - src/checks/**
      - tests/smoke/horizontal-alignment.test.mjs
  - id: build_validation_gateway_wave
    label: Build, validation, and gateway concept-root wave
    group: source_target
    kind: component
