schema_version: 1
id: spec.system.diagrams.key-flow
title: CodeWiki Intent-to-Implementation Flow
kind: sequence_flow
purpose: Show the core workflow from user intent through decision, roadmap work, implementation, validation, and evidence.
source_docs:
  - .codewiki/kb/system/compilers.md
  - .codewiki/kb/system/builds.md
  - .codewiki/kb/system/roadmap.md
  - .codewiki/kb/system/validation-gateway.md
renderer:
  preferred: mermaid_sequence
  fallback: custom_sequence
participants:
  - id: user
    label: User
    kind: actor
  - id: decision_compiler
    label: Decision compiler
    kind: workflow
    source: .codewiki/kb/system/compilers.md
  - id: decision_build
    label: Decision build
    kind: build
    source: .codewiki/kb/system/builds.md
  - id: knowledge
    label: Knowledge
    kind: durable_truth
    source: .codewiki/kb/system/knowledge.md
  - id: planning_compiler
    label: Planning compiler
    kind: workflow
    source: .codewiki/kb/system/compilers.md
  - id: roadmap
    label: Roadmap
    kind: work_truth
    source: .codewiki/kb/system/roadmap.md
  - id: implementation_compiler
    label: Implementation compiler
    kind: workflow
    source: .codewiki/kb/system/compilers.md
  - id: code_tests
    label: Code + tests
    kind: executable_truth
  - id: validation_gateway
    label: Validation gateway
    kind: gate
    source: .codewiki/kb/system/validation-gateway.md
  - id: implementation_build
    label: Implementation build
    kind: build
    source: .codewiki/kb/system/builds.md
steps:
  - id: capture_intent
    from: user
    to: decision_compiler
    message: provides intent, constraints, and decisions
  - id: propose_diff
    from: decision_compiler
    to: user
    message: proposes decision rows for approval
  - id: apply_decision
    from: decision_compiler
    to: knowledge
    message: applies approved rows to product/system truth
  - id: compile_decision
    from: knowledge
    to: decision_build
    message: records approved rows, KB mappings, and propagation evidence
  - id: plan_work
    from: decision_build
    to: planning_compiler
    message: handoff accepted intent and knowledge changes
  - id: open_work
    from: planning_compiler
    to: roadmap
    message: creates or refines executable work
  - id: resume_context
    from: roadmap
    to: implementation_compiler
    message: builds bounded resume context from graph, task shard, evidence, and refs
  - id: build_code
    from: implementation_compiler
    to: code_tests
    message: changes code/tests inside task scope
  - id: validate
    from: implementation_compiler
    to: validation_gateway
    message: submits checks and acceptance evidence
  - id: record_evidence
    from: validation_gateway
    to: implementation_build
    message: accepted evidence and closure brief
  - id: close_task
    from: implementation_build
    to: roadmap
    message: supports task closure or follow-up
ui_hints:
  default_focus: capture_intent
  show_gate_steps:
    - validate
