schema_version: 1
id: spec.system.diagrams.key-flow
title: CodeWiki Intent-to-Implementation Flow
kind: sequence_flow
purpose: Show the target flow from user intent through decision, planning, implementation, JSONL traces, generated views, and Git evidence.
source_docs:
  - .codewiki/kb/system/compilers.md
  - .codewiki/kb/system/traces.md
  - .codewiki/kb/system/validation-gateway.md
  - .codewiki/kb/system/runtime.md
renderer:
  preferred: mermaid_sequence
  fallback: custom_sequence
participants:
  - id: user
    label: User
    kind: actor
  - id: decision
    label: Decision loop
    kind: compiler_loop
    source: .codewiki/kb/system/compilers.md
  - id: planning
    label: Planning loop
    kind: compiler_loop
    source: .codewiki/kb/system/compilers.md
  - id: implementation
    label: Implementation loop
    kind: compiler_loop
    source: .codewiki/kb/system/compilers.md
  - id: runtime
    label: Runtime coordination
    kind: runtime
    source: .codewiki/kb/system/runtime.md
  - id: traces
    label: JSONL traces
    kind: durable_truth
    source: .codewiki/kb/system/traces.md
  - id: views
    label: Generated views
    kind: generated_projection
    source: .codewiki/kb/system/file-structure.md
  - id: git
    label: Git content evidence
    kind: executable_truth
steps:
  - id: capture_intent
    from: user
    to: decision
    message: provides intent, constraints, alternatives, and approval needs
  - id: approve_decision
    from: decision
    to: traces
    message: appends approved decision rows, risks, refs, and decision gate result
  - id: materialize_work
    from: traces
    to: planning
    message: replays accepted decision events into work units, ordering, and verification plan
  - id: planning_gate
    from: planning
    to: traces
    message: appends planning coverage, conflicts, work-plan ownership, and planning gate result
  - id: schedule_work
    from: traces
    to: runtime
    message: derives runnable boundaries, budgets, claims, and temporary working paths
  - id: implement
    from: runtime
    to: implementation
    message: dispatches implementation work with source refs and content-evidence requirements
  - id: record_implementation
    from: implementation
    to: traces
    message: appends changed paths, tests, checks, content proof, and implementation gate result
  - id: prove_content
    from: implementation
    to: git
    message: commits or records exact working-tree/content evidence
  - id: project_views
    from: traces
    to: views
    message: regenerates status, resume, work-plan, blockers, and conflicts views
  - id: render_status
    from: views
    to: user
    message: shows terminal status/work-plan output
ui_hints:
  default_focus: capture_intent
  show_gate_steps:
    - approve_decision
    - planning_gate
    - record_implementation
