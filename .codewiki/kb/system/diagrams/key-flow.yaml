schema_version: 1
id: spec.system.diagrams.key-flow
title: CodeWiki Intent-to-Production Flow
kind: sequence_flow
purpose: Show exact candidate production, candidate-specific Checks, deterministic exit, global Planning, isolated workers, Integration, and separately guarded effects.
source_docs:
  - .codewiki/kb/system/components/loop-model.md
  - .codewiki/kb/system/components/codewiki-os.md
  - .codewiki/kb/system/components/loop-exit.md
  - .codewiki/kb/system/components/worker-workbench.md
  - .codewiki/kb/system/components/decision-loop.md
  - .codewiki/kb/system/components/planning-loop.md
  - .codewiki/kb/system/components/implementation-loop.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/components/runtime.md
renderer:
  preferred: mermaid_sequence
  fallback: custom_sequence
participants:
  - id: client
    label: CLI / dashboard / optional Pi client
    kind: client
  - id: runtime
    label: Project Runtime
    kind: coordination
    source: .codewiki/kb/system/components/runtime.md
  - id: pi_sessions
    label: Pi sessions with CodeWiki OS / Loop Protocol / scoped Skills
    kind: execution_adapter
    source: .codewiki/kb/system/components/codewiki-os.md
  - id: decision
    label: Decision Loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/decision-loop.md
  - id: planning
    label: Global Planning Loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/planning-loop.md
  - id: loop_exit
    label: Candidate identity / Exit Policy / Code and Model Checks / Exit Report
    kind: loop_exit_runtime
    source: .codewiki/kb/system/components/loop-exit.md
  - id: workbench
    label: Private Worker Workbench
    kind: transient_execution_environment
    source: .codewiki/kb/system/components/worker-workbench.md
  - id: workers
    label: Isolated implementation workers
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: implementation
    label: Implementation Loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/implementation-loop.md
  - id: traces
    label: JSONL Change Traces
    kind: durable_truth
    source: .codewiki/kb/system/components/traces.md
  - id: project_state
    label: Knowledge / source / tests / Git / delivery observations
    kind: canonical_truth
  - id: views
    label: WorkState + Work / Alignment / Learning views
    kind: generated_projection
    source: .codewiki/kb/system/components/work-state.md
steps:
  - id: submit_intent
    from: client
    to: runtime
    message: submits bounded authenticated intent; trigger grants no semantic authority
  - id: persist_change
    from: runtime
    to: traces
    message: creates one pending Change revision with runtime-owned identity and time
  - id: produce_decision
    from: runtime
    to: pi_sessions
    message: starts bounded Decision candidate producer against exact project snapshot
  - id: submit_decision_candidate
    from: pi_sessions
    to: decision
    message: returns role-specific candidate content without runtime-owned fields
  - id: check_decision
    from: decision
    to: loop_exit
    message: Runtime identities candidate, resolves policy, fans out independent Checks, and builds Exit Report
  - id: append_decision
    from: loop_exit
    to: traces
    message: Runtime appends exact approved or terminal disposition after generation, freshness, authority, and CAS guard
  - id: dirty_planning
    from: traces
    to: runtime
    message: approved portfolio change makes bounded global Planning horizon eligible
  - id: produce_planning
    from: runtime
    to: pi_sessions
    message: admits one Planning writer with exact portfolio and relationship context
  - id: submit_planning_candidate
    from: pi_sessions
    to: planning
    message: returns Sprints, worker-ready Work Items, dependencies, verification, Integration, and Workbench requirements
  - id: check_planning
    from: planning
    to: loop_exit
    message: resolves candidate-specific Planning Checks and complete required-result fan-in
  - id: append_planning
    from: loop_exit
    to: traces
    message: Runtime appends deterministic participant slices and repairs partial epochs before Claims
  - id: select_frontier
    from: traces
    to: runtime
    message: WorkState yields compatible ready Work Items under dependencies, Claims, capacity, and supervision
  - id: provision_workbench
    from: runtime
    to: workbench
    message: binds exact source, context, Skills/tools, tier/route, frozen Checks/evidence, isolation, and budgets
  - id: start_worker
    from: workbench
    to: workers
    message: exact matching Claim activates concurrent non-conflicting Assignment
  - id: worker_report
    from: workers
    to: runtime
    message: returns immutable Worker Report candidate evidence only
  - id: build_implementation_candidate
    from: runtime
    to: implementation
    message: binds Worker Report with exact source/test/Git/Integration observations
  - id: check_implementation
    from: implementation
    to: loop_exit
    message: actual effects may add Checks; required Results fan in without suppressing unrelated feedback
  - id: append_implementation
    from: loop_exit
    to: traces
    message: Runtime appends exact realization or remediation after final guards
  - id: integrate
    from: runtime
    to: project_state
    message: creates guarded Integration commit/tree proof for accepted worker output
  - id: delivery_effects
    from: runtime
    to: project_state
    message: separately authorizes merge, push, publication, release, and later observation
  - id: project_views
    from: traces
    to: views
    message: folds Change dossiers, Work, Alignment, Learning, blockers, and outcomes
  - id: render
    from: views
    to: client
    message: streams bounded state, provenance, coverage, held reasons, evidence, and next safe action
ui_hints:
  default_focus: check_implementation
  show_exit_steps:
    - append_decision
    - append_planning
    - append_implementation
