schema_version: 1
id: spec.system.diagrams.key-flow
title: CodeWiki Intent-to-Production Flow
kind: sequence_flow
purpose: Show bounded multi-source Change intake, explainable Backlog triage, exact Decision, rolling Planning, Work Item Claim execution, integrated Implementation assurance, provider-neutral Git acceptance, deterministic projections, archive, and separately guarded effects.
source_docs:
  - .codewiki/kb/system/components/loop-model.md
  - .codewiki/kb/system/components/change-intake.md
  - .codewiki/kb/system/components/custom-checks.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/components/runtime.md
  - .codewiki/kb/system/components/work-state.md
  - .codewiki/kb/system/components/planning-loop.md
  - .codewiki/kb/system/components/loop-exit.md
  - .codewiki/kb/system/components/evidence.md
  - .codewiki/kb/system/flows/remote-state-synchronization.md
renderer:
  preferred: mermaid_sequence
  fallback: custom_sequence
participants:
  - id: client
    label: CLI / dashboard / optional Pi client
    kind: client
  - id: runtime
    label: Project Runtime
    kind: project_control_plane
    source: .codewiki/kb/system/components/runtime.md
  - id: git_state
    label: Provider-neutral Git state/archive refs
    kind: synchronization_carrier
    source: .codewiki/kb/system/components/traces.md
  - id: sessions
    label: Independent Pi Candidate and Check Evaluator sessions
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: decision
    label: Decision Loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/decision-loop.md
  - id: planning
    label: Rolling Planning Loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/planning-loop.md
  - id: implementation
    label: Implementation Loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/implementation-loop.md
  - id: loop_exit
    label: Candidate / Evidence / Policy / Checks / Results / Report
    kind: loop_exit_runtime
    source: .codewiki/kb/system/components/loop-exit.md
  - id: workbench
    label: Exact private Worker Workbench
    kind: transient_execution_environment
    source: .codewiki/kb/system/components/worker-workbench.md
  - id: workers
    label: Isolated implementation workers
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: project_state
    label: Knowledge / source / tests / Integration / delivery providers
    kind: authority_roots
  - id: projections
    label: WorkState + Alignment Graph + Backlog Triage + views
    kind: deterministic_and_disposable_projections
    source: .codewiki/kb/system/components/work-state.md
steps:
  - id: fetch_state
    from: runtime
    to: git_state
    message: fetches and verifies codewiki/state; computes fresh, stale, or offline snapshot
  - id: submit_intent
    from: client
    to: runtime
    message: submits bounded authenticated user suggestion or selected review material; request grants no semantic authority
  - id: observe_intake
    from: project_state
    to: runtime
    message: supplies exact-head provider review, regression/scanner, delivery/outcome, or Knowledge-drift material
  - id: route_intake
    from: runtime
    to: runtime
    message: authenticates, sanitizes, deduplicates, classifies source claims, and routes current-scope feedback versus independent Change
  - id: open_change
    from: runtime
    to: git_state
    message: expected-head accepts pending Change or exact current-Change feedback operations; stale admission fetches and reevaluates
  - id: project_backlog
    from: git_state
    to: projections
    message: builds exact WorkState, Alignment Graph, and snapshot-bound explainable Backlog Triage Projection
  - id: select_decision_attention
    from: projections
    to: runtime
    message: offers eligible pending revisions for bounded user or scheduler selection without assigning execution priority
  - id: produce_decision
    from: runtime
    to: sessions
    message: starts bounded Decision Candidate producer against exact snapshot
  - id: decision_candidate
    from: sessions
    to: decision
    message: returns typed Candidate content without Runtime-owned fields
  - id: decision_exit
    from: decision
    to: loop_exit
    message: Candidate then protected-base Custom Check activation, Evidence Records, Resolved Exit Policy, Checks, Check Results, and Exit Report
  - id: decision_route
    from: loop_exit
    to: runtime
    message: returns exact Exit Report for Runtime Route and final authority/freshness guard
  - id: accept_decision
    from: runtime
    to: git_state
    message: expected-head accepts exact Decision operations and disposition
  - id: trigger_planning
    from: git_state
    to: runtime
    message: newly accepted Change makes rolling Planning horizon eligible
  - id: produce_planning
    from: runtime
    to: sessions
    message: starts one Planning writer with selected Change set, active work, conflicts, and exact snapshot
  - id: planning_candidate
    from: sessions
    to: planning
    message: returns Work Items, dependencies, verification, Integration, active-work disposition, and Worker Workbench requirements
  - id: planning_exit
    from: planning
    to: loop_exit
    message: evaluates exact Planning Candidate through protected-base Custom Check activation, Evidence, policy, Checks, Results, and Exit Report
  - id: accept_epoch
    from: runtime
    to: git_state
    message: atomically accepts PlanningEpochRecord and every planning.epoch_bound operation
  - id: select_frontier
    from: git_state
    to: runtime
    message: fresh WorkState yields safe execution frontier under dependencies and ownership
  - id: provision_workbench
    from: runtime
    to: workbench
    message: binds exact source, context, protocol, Skills/tools, route, obligations, isolation, and budgets
  - id: acquire_work_item_claim
    from: runtime
    to: git_state
    message: expected-head accepts work_item_claim.acquired and assignment.dispatched
  - id: start_worker
    from: workbench
    to: workers
    message: exact Work Item Claim and Assignment activate non-conflicting attempt
  - id: worker_report
    from: workers
    to: runtime
    message: returns immutable asserted Worker Report plus bounded Assignment-bound discoveries only
  - id: route_worker_discoveries
    from: runtime
    to: runtime
    message: keeps in-scope defects on current Change and may propose linked pending Changes for independent discrepancies
  - id: integrate
    from: runtime
    to: project_state
    message: combines accepted worker output into exact Integration tree and observes proof
  - id: implementation_candidate
    from: runtime
    to: implementation
    message: constructs exact integrated Candidate and materializes Evidence Records
  - id: optional_review_projection
    from: runtime
    to: project_state
    message: after non-approval readiness Checks, may publish isolated review projection and re-observe ordinary reviewer findings plus exact approval Evidence
  - id: route_review_findings
    from: project_state
    to: runtime
    message: correlates any configured human or agent reviewer at exact head and routes actionable findings through Change intake
  - id: implementation_exit
    from: implementation
    to: loop_exit
    message: runs final candidate-specific kernel and Custom Checks including UI review/approval when activated
  - id: implementation_route
    from: loop_exit
    to: runtime
    message: returns Exit Report; Runtime routes repair, wait, block, route-back, or advance
  - id: accept_implementation
    from: runtime
    to: git_state
    message: expected-head accepts exact Implementation, Integration, and Work Item Claim release operations
  - id: guarded_effects
    from: runtime
    to: project_state
    message: separately authorizes merge, push, publication, release, delivery, and outcome observation
  - id: accept_effects
    from: runtime
    to: git_state
    message: records only exactly re-observed effects under current authority
  - id: project
    from: git_state
    to: projections
    message: deterministic replay builds WorkState and per-fact-provenance Alignment Graph
  - id: render
    from: projections
    to: client
    message: streams bounded state, coverage, provenance, held reasons, Evidence, and next safe action
  - id: archive
    from: runtime
    to: git_state
    message: pushes and verifies terminal immutable archive before removing hot copy
ui_hints:
  default_focus: accept_epoch
  show_exit_steps:
    - decision_exit
    - planning_exit
    - implementation_exit
