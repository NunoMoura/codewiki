schema_version: 1
id: spec.system.diagrams.key-flow
title: CodeWiki Intent-to-Implementation Flow
kind: sequence_flow
purpose: Show target flow from user intent through semantic loop iterations, runtime coordination, JSONL traces, generated views, and Git evidence.
source_docs:
  - .codewiki/kb/system/loop-model.md
  - .codewiki/kb/system/decision-loop.md
  - .codewiki/kb/system/planning-loop.md
  - .codewiki/kb/system/implementation-loop.md
  - .codewiki/kb/system/traces.md
  - .codewiki/kb/system/runtime.md
renderer:
  preferred: mermaid_sequence
  fallback: custom_sequence
participants:
  - id: user
    label: User
    kind: actor
  - id: runtime
    label: Runtime outer loop
    kind: coordination
    source: .codewiki/kb/system/runtime.md
  - id: decision
    label: Decision loop
    kind: semantic_loop
    source: .codewiki/kb/system/decision-loop.md
  - id: planning
    label: Planning loop
    kind: semantic_loop
    source: .codewiki/kb/system/planning-loop.md
  - id: implementation
    label: Implementation loop
    kind: semantic_loop
    source: .codewiki/kb/system/implementation-loop.md
  - id: traces
    label: JSONL traces
    kind: durable_truth
    source: .codewiki/kb/system/traces.md
  - id: views
    label: Generated views
    kind: generated_projection
    source: .codewiki/kb/system/source-map.md
  - id: git
    label: Git content evidence
    kind: executable_truth
steps:
  - id: capture_intent
    from: user
    to: runtime
    message: provides intent, constraints, alternatives, and approval needs
  - id: run_decision
    from: runtime
    to: decision
    message: runs decision loop cycle and evaluates exit conditions
  - id: append_decision
    from: decision
    to: traces
    message: appends decision.rows_approved with output, exit status, conditions, progress, and refs
  - id: run_planning
    from: runtime
    to: planning
    message: runs planning loop from exited decision output
  - id: append_planning
    from: planning
    to: traces
    message: appends planning.work_units_created with work units, acceptance, path scopes, conditions, and refs
  - id: schedule_work
    from: traces
    to: runtime
    message: folds traces and derives runnable work queue, claims, budgets, and temp paths
  - id: run_implementation
    from: runtime
    to: implementation
    message: runs implementation loop or starts workers with source refs and content-evidence requirements
  - id: append_implementation
    from: implementation
    to: traces
    message: appends implementation.evidence_accepted with evidence, checks, worker provenance, proof, exit conditions, and refs
  - id: prove_content
    from: implementation
    to: git
    message: records exact working-tree, tree, commit, restore, or publication evidence
  - id: project_views
    from: traces
    to: views
    message: regenerates status, resume, work-plan, work-queue, quality, blockers, and conflicts views
  - id: render_state
    from: views
    to: user
    message: shows state, next action, and unresolved exit conditions
ui_hints:
  default_focus: run_decision
  show_exit_steps:
    - append_decision
    - append_planning
    - append_implementation
