schema_version: 1
id: spec.system.diagrams.key-flow
title: CodeWiki Portfolio Intent-to-Implementation Flow
kind: sequence_flow
purpose: Show concurrent proposal intake, runtime-owned semantic sessions, global Planning, parallel isolated workers, Implementation acceptance, and canonical proof.
source_docs:
  - .codewiki/kb/system/components/loop-model.md
  - .codewiki/kb/system/components/decision-loop.md
  - .codewiki/kb/system/components/planning-loop.md
  - .codewiki/kb/system/components/implementation-loop.md
  - .codewiki/kb/system/components/session-coordination.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/components/runtime.md
renderer:
  preferred: mermaid_sequence
  fallback: custom_sequence
participants:
  - id: client
    label: Dashboard / Pi / bounded client
    kind: client
  - id: control_plane
    label: Project control plane
    kind: coordination
    source: .codewiki/kb/system/components/runtime.md
  - id: semantic_sessions
    label: Embedded read-only semantic sessions
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: decision
    label: Decision loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/decision-loop.md
  - id: planning
    label: Global Planning loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/planning-loop.md
  - id: workers
    label: Isolated implementation workers
    kind: execution_adapter
    source: .codewiki/kb/system/components/session-coordination.md
  - id: implementation
    label: Implementation loop
    kind: semantic_loop
    source: .codewiki/kb/system/components/implementation-loop.md
  - id: traces
    label: JSONL Change Traces
    kind: durable_truth
    source: .codewiki/kb/system/components/traces.md
  - id: knowledge_git
    label: Knowledge / source / tests / Git
    kind: canonical_truth
  - id: views
    label: WorkState and client projections
    kind: generated_projection
    source: .codewiki/kb/system/components/work-state.md
steps:
  - id: submit_proposals
    from: client
    to: control_plane
    message: authenticated users or agents submit concurrent idempotent proposals
  - id: persist_pending_changes
    from: control_plane
    to: traces
    message: persists one pending Change revision and provenance per proposal
  - id: schedule_decisions
    from: control_plane
    to: semantic_sessions
    message: starts compatible read-only Decision jobs for independent Change revisions
  - id: submit_decision_candidates
    from: semantic_sessions
    to: decision
    message: returns typed judgment candidates without append authority
  - id: append_decisions
    from: decision
    to: traces
    message: control plane appends accepted Decision results under exact revision and CAS guards
  - id: mark_planning_dirty
    from: traces
    to: control_plane
    message: approved portfolio changes mark one bounded project Planning horizon dirty
  - id: schedule_planning
    from: control_plane
    to: semantic_sessions
    message: admits one Planning writer and supplies exact project context
  - id: submit_planning_candidate
    from: semantic_sessions
    to: planning
    message: returns one candidate epoch spanning approved Changes, Sprints, Work Items, dependencies, and integration
  - id: append_planning_epoch
    from: planning
    to: traces
    message: control plane writes deterministic participant slices and exposes partial-commit recovery
  - id: select_parallel_frontier
    from: traces
    to: control_plane
    message: WorkState yields compatible ready Work Items under claims, conflicts, capacity, and supervision
  - id: start_workers
    from: control_plane
    to: workers
    message: starts concurrent non-conflicting Assignments in process or container isolation
  - id: worker_candidates
    from: workers
    to: implementation
    message: returns candidate changes, checks, provenance, and exact evidence refs
  - id: review_and_integrate
    from: control_plane
    to: semantic_sessions
    message: starts bounded read-only Implementation review over exact worker and integration state
  - id: submit_implementation_candidate
    from: semantic_sessions
    to: implementation
    message: returns acceptance, remediation, or route-back candidate
  - id: append_implementation
    from: implementation
    to: traces
    message: control plane appends accepted realization or recovery result to owning Change traces
  - id: prove_content
    from: implementation
    to: knowledge_git
    message: binds accepted realization to exact source, tests, tree, commit, and restore evidence
  - id: project_state
    from: traces
    to: views
    message: folds Backlog, Planning, Implementation, Change dossiers, quality, blockers, and outcomes
  - id: render_state
    from: views
    to: client
    message: streams current state, held reasons, interventions, evidence, and recovery
ui_hints:
  default_focus: select_parallel_frontier
  show_exit_steps:
    - append_decisions
    - append_planning_epoch
    - append_implementation
