schema_version: 1
id: spec.system.diagrams.state-lifecycle
title: CodeWiki Task and Compiler Lifecycle
kind: state_lifecycle
purpose: Show how intent, decision builds, roadmap tasks, validation, implementation evidence, and publication readiness move through CodeWiki.
source_docs:
  - .codewiki/kb/system/compilers.md
  - .codewiki/kb/system/builds.md
  - .codewiki/kb/system/roadmap.md
  - .codewiki/kb/system/validation-gateway.md
  - .codewiki/kb/system/graph.md
  - .codewiki/kb/system/alignment-model.md
  - .codewiki/kb/system/agency.md
  - .codewiki/kb/system/runtime.md
  - .codewiki/kb/system/adapters.md
renderer:
  preferred: mermaid_state
  fallback: custom_state
transition_policy:
  operational_source: graph-backed state machine
  analytics_projection: Markov/MDP-style transition metrics are derived from graph snapshots, builds, validation reports, source fingerprints, and Git history; they do not replace the graph.
  route_fields:
    - failure_class
    - recommended_next_loop
states:
  - id: user_intent
    label: User intent captured
    kind: input
  - id: decision_rows_proposed
    label: Decision rows proposed
    kind: decision_gate
  - id: decision_build_accepted
    label: Decision build accepted and gateway passed
    kind: build
  - id: knowledge_updated
    label: Knowledge updated
    kind: durable_truth
  - id: planning_build_accepted
    label: Planning build accepted and gateway passed
    kind: build
  - id: task_todo
    label: Roadmap task todo
    kind: work
  - id: task_in_progress
    label: Task in progress
    kind: work
  - id: context_reset
    label: Context reset and auto-pickup
    kind: hygiene
  - id: daemon_job_queued
    label: Daemon job queued
    kind: runtime
  - id: daemon_run_active
    label: Daemon run active and heartbeating
    kind: runtime
  - id: daemon_job_completed
    label: Daemon job completed with handoff refs
    kind: runtime
  - id: daemon_job_blocked
    label: Daemon job blocked with reason
    kind: blocked
  - id: task_verify
    label: Task verify
    kind: gate
  - id: implementation_build_accepted
    label: Implementation build accepted and gateway passed
    kind: evidence
  - id: task_done
    label: Task done
    kind: closed
  - id: task_blocked
    label: Task blocked
    kind: blocked
  - id: follow_up_opened
    label: Follow-up opened
    kind: work
transitions:
  - from: user_intent
    to: decision_rows_proposed
    trigger: decision compiler proposes rows
  - from: decision_rows_proposed
    to: knowledge_updated
    trigger: user approves rows and decision compiler applies KB changes
    gate: user decision
  - from: knowledge_updated
    to: decision_build_accepted
    trigger: decision build records row-to-KB and propagation evidence
    gate: decision validation
  - from: knowledge_updated
    to: decision_rows_proposed
    trigger: decision validation fails or blocks with decision ambiguity, missing approval, or incomplete semantic mapping
    gate: failure_class and recommended_next_loop
  - from: decision_build_accepted
    to: planning_build_accepted
    trigger: planning compiler creates/refines roadmap work and planning validation passes
  - from: planning_build_accepted
    to: planning_build_accepted
    trigger: planning validation fails locally and planner emits a superseding planning build
    gate: failure_class and recommended_next_loop
  - from: planning_build_accepted
    to: decision_rows_proposed
    trigger: planning validation reveals ambiguous intent, unapproved semantics, or missing risk approval
    gate: failure_class and recommended_next_loop
  - from: planning_build_accepted
    to: task_todo
    trigger: validated planning output makes roadmap task implementation-ready
  - from: task_todo
    to: task_in_progress
    trigger: implementation resumes task
  - from: task_in_progress
    to: context_reset
    trigger: agency or loop boundary requests CodeWiki-owned reset and agency level still allows continuation
    gate: protocol-safe source-backed kickoff
  - from: context_reset
    to: task_in_progress
    trigger: adapter delivers auto-pickup kickoff from resume context
  - from: task_in_progress
    to: daemon_job_queued
    trigger: agency/runtime records a durable execution attempt without changing roadmap truth
  - from: daemon_job_queued
    to: daemon_run_active
    trigger: worker claims artifact-status scopes and starts run
  - from: daemon_run_active
    to: daemon_job_completed
    trigger: run outcome pass records build, validation, content, and handoff refs
    gate: compiler/gateway pass evidence
  - from: daemon_run_active
    to: daemon_job_blocked
    trigger: run outcome fail, block, error, stale heartbeat, budget stop, conflict, or missing proof
    gate: block_reason and retry_limit
  - from: daemon_job_blocked
    to: daemon_job_queued
    trigger: blocker resolved and max_attempts permits retry of same execution request
  - from: daemon_job_blocked
    to: task_blocked
    trigger: retry limit reached or user/policy input required
  - from: daemon_job_completed
    to: task_in_progress
    trigger: handoff resumes compiler loop from source refs; roadmap remains canonical task truth
  - from: task_in_progress
    to: task_verify
    trigger: checks and acceptance evidence ready
  - from: task_verify
    to: implementation_build_accepted
    trigger: implementation validation passes
    gate: implementation validation
  - from: task_verify
    to: task_in_progress
    trigger: implementation validation fails locally and builder emits a superseding implementation build
    gate: failure_class and recommended_next_loop
  - from: task_verify
    to: planning_build_accepted
    trigger: implementation validation reveals a planning gap
    gate: failure_class and recommended_next_loop
  - from: task_verify
    to: decision_rows_proposed
    trigger: implementation validation reveals ambiguous intent, unapproved semantics, or missing risk approval
    gate: failure_class and recommended_next_loop
  - from: implementation_build_accepted
    to: task_done
    trigger: task closure evidence recorded
  - from: task_verify
    to: task_blocked
    trigger: validation fails, blocks, policy requires stop, content proof is missing, or runtime conflict cannot proceed
    gate: verifier or policy
  - from: task_done
    to: follow_up_opened
    trigger: new accepted delta appears after closure
  - from: task_blocked
    to: task_in_progress
    trigger: blocker resolved and task resumes
ui_hints:
  default_state: user_intent
  terminal_states:
    - task_done
    - task_blocked
