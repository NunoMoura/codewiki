schema_version: 1
id: spec.system.diagrams.state-lifecycle
title: One Change Dossier Lifecycle
kind: state_lifecycle
purpose: Show one Change's derived lifecycle across exact Loop attempts, rolling Planning, Work Item Claim execution, review, Integration, delivery, outcome, archive, hydration, and reopening without making status caller-controlled.
source_docs:
  - .codewiki/kb/system/components/loop-model.md
  - .codewiki/kb/system/components/change-intake.md
  - .codewiki/kb/system/components/loop-exit.md
  - .codewiki/kb/system/components/evidence.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/components/runtime.md
renderer:
  preferred: state_machine
  fallback: mermaid_state
states:
  - id: proposed
    label: Proposed Change
  - id: decision_active
    label: Decision active
  - id: planning_eligible
    label: Eligible for rolling Planning
  - id: planned
    label: Bound to accepted Planning epoch
  - id: work_ready
    label: Work Item ready
  - id: implementation_active
    label: Work Item Claim / Assignment active
  - id: integrated
    label: Exact Integration proven
  - id: review_ready
    label: Exact integrated Candidate awaiting review
  - id: waiting
    label: Waiting / blocked / indeterminate
  - id: route_back
    label: Earlier authority required
  - id: realized
    label: Semantic realization accepted
  - id: merged
    label: Source branch merge recorded
  - id: pushed
    label: Remote branch push recorded
  - id: published
    label: Product publication recorded
  - id: released
    label: Product release recorded
  - id: outcome_observed
    label: Outcome disposition recorded
  - id: closed
    label: Terminal Trace closed
  - id: archived
    label: Immutable archive verified
  - id: reopened
    label: New hot segment opened
transitions:
  - from: proposed
    to: decision_active
    trigger: Runtime admits exact pending revision from bounded authenticated intake and selects it from current Backlog Triage Projection
    operation: change.proposed
  - from: decision_active
    to: planning_eligible
    trigger: exact Decision Candidate passes and accepted Runtime Route/disposition advances
    operation: runtime.route_recorded
    exit_status: pass
  - from: decision_active
    to: waiting
    trigger: required Decision Result is indeterminate or authority/capability unavailable
    operation: loop.exit_report_recorded
    exit_status: indeterminate
  - from: decision_active
    to: route_back
    trigger: Decision Candidate fails or requires revised intent/authority
    operation: runtime.route_recorded
    exit_status: fail
  - from: planning_eligible
    to: planned
    trigger: atomic Planning epoch and participant binding accepted
    operation: planning.epoch_bound
    exit_status: pass
  - from: planned
    to: work_ready
    trigger: WorkState dependencies and conflicts permit safe execution frontier
    operation: planning.epoch_bound
  - from: work_ready
    to: implementation_active
    trigger: exact Work Item Claim and Assignment accepted
    operation: work_item_claim.acquired
  - from: implementation_active
    to: integrated
    trigger: Runtime combines accepted output into exact isolated Integration tree and materializes proof
    operation: integration.result_recorded
  - from: integrated
    to: review_ready
    trigger: required non-approval review-readiness Checks pass and exact human approval Evidence remains required
    operation: check.result_recorded
  - from: review_ready
    to: implementation_active
    trigger: reviewer requests changes or Candidate/tree/media/bundle drift invalidates approval
    operation: evidence.recorded
  - from: review_ready
    to: waiting
    trigger: required review/provider/media Evidence is unavailable or indeterminate
    operation: loop.exit_report_recorded
    exit_status: indeterminate
  - from: review_ready
    to: realized
    trigger: authenticated approval receipt matches exact integrated Candidate and final Exit Report passes
    operation: runtime.route_recorded
    exit_status: pass
  - from: integrated
    to: realized
    trigger: no human review required and exact integrated Candidate Exit Report passes
    operation: runtime.route_recorded
    exit_status: pass
  - from: implementation_active
    to: route_back
    trigger: worker or Integration material requires Planning or Decision authority
    operation: runtime.route_recorded
    exit_status: fail
  - from: integrated
    to: route_back
    trigger: final Runtime Route requires Planning or Decision authority
    operation: runtime.route_recorded
    exit_status: fail
  - from: implementation_active
    to: waiting
    trigger: worker or Integration capability is unavailable or indeterminate
    operation: loop.exit_report_recorded
    exit_status: indeterminate
  - from: integrated
    to: waiting
    trigger: required Implementation Result is indeterminate or Runtime wait applies
    operation: loop.exit_report_recorded
    exit_status: indeterminate
  - from: route_back
    to: decision_active
    trigger: target authority is Decision and Change revision is accepted for reevaluation
    operation: change.revised
  - from: route_back
    to: planning_eligible
    trigger: target authority is Planning and fresh WorkState permits new epoch
    operation: runtime.route_recorded
  - from: waiting
    to: decision_active
    trigger: Decision authority or Evidence becomes available
    operation: loop.attempt_started
  - from: waiting
    to: planning_eligible
    trigger: Planning dependency or Evidence becomes available
    operation: loop.attempt_started
  - from: waiting
    to: implementation_active
    trigger: Implementation capability or Evidence becomes available and ownership remains exact
    operation: loop.attempt_started
  - from: realized
    to: merged
    trigger: separately authorized exact fast-forward merge of the assured Integration tree observed
    operation: source.branch_merge_recorded
  - from: merged
    to: pushed
    trigger: separately authorized exact remote push observed
    operation: source.branch_push_recorded
  - from: pushed
    to: published
    trigger: separately authorized artifact publication observed
    operation: product.publication_recorded
  - from: published
    to: released
    trigger: separately authorized release promotion observed
    operation: product.release_recorded
  - from: realized
    to: outcome_observed
    trigger: no later delivery boundary required and outcome disposition recorded
    operation: outcome.observation_recorded
  - from: pushed
    to: outcome_observed
    trigger: push is final required boundary and outcome disposition recorded
    operation: outcome.observation_recorded
  - from: published
    to: outcome_observed
    trigger: publication is final required boundary and outcome disposition recorded
    operation: outcome.observation_recorded
  - from: released
    to: outcome_observed
    trigger: release outcome disposition recorded
    operation: outcome.observation_recorded
  - from: outcome_observed
    to: closed
    trigger: no active Change Claim or Work Item Claim and all configured terminal obligations complete
    operation: trace.closed
  - from: closed
    to: archived
    trigger: archive pushed, fetched, and digest-verified before hot removal
    archive_record: verified ArchiveManifest; no archive operation
  - from: archived
    to: reopened
    trigger: authorized reopen creates new hot segment referencing archived tail/closure
    operation: trace.reopened
  - from: reopened
    to: decision_active
    trigger: reopened intent requires Decision reevaluation
    operation: loop.attempt_started
