schema_version: 1
id: spec.system.diagrams.state-lifecycle
title: CodeWiki Trace State Lifecycle
kind: state_lifecycle
purpose: Show target trace lifecycle states and cleanup boundaries.
source_docs:
  - .codewiki/kb/system/traces.md
  - .codewiki/kb/system/runtime.md
renderer:
  preferred: state_machine
  fallback: mermaid_state
states:
  - id: decision_active
    label: Decision active
  - id: planning_active
    label: Planning active
  - id: implementation_active
    label: Implementation active
  - id: blocked
    label: Blocked/remediation needed
  - id: production_ready
    label: Production ready
  - id: published
    label: Published
  - id: closed
    label: Closed/retained
transitions:
  - from: decision_active
    to: planning_active
    trigger: decision gate pass
    trace_event: decision.gate.pass
    cleanup: clean decision tmp after durable refs exist
  - from: decision_active
    to: blocked
    trigger: decision gate fail or block
    trace_event: decision.gate.block
    cleanup: preserve decision tmp
  - from: planning_active
    to: implementation_active
    trigger: planning gate pass
    trace_event: planning.gate.pass
    cleanup: clean planning tmp after durable refs exist
  - from: planning_active
    to: blocked
    trigger: planning gate fail or block
    trace_event: planning.gate.block
    cleanup: preserve planning tmp
  - from: implementation_active
    to: production_ready
    trigger: implementation gate pass
    trace_event: implementation.gate.pass
    cleanup: clean implementation tmp after durable refs exist
  - from: implementation_active
    to: blocked
    trigger: implementation gate fail or block
    trace_event: implementation.gate.block
    cleanup: preserve implementation tmp
  - from: production_ready
    to: published
    trigger: optional implementation-stage publication proof
    trace_event: implementation.publication.pass
  - from: production_ready
    to: closed
    trigger: close without publication requirement
    trace_event: trace.close
    cleanup: delete all remaining trace tmp
  - from: published
    to: closed
    trigger: close after publication proof
    trace_event: trace.close
    cleanup: delete all remaining trace tmp
