schema_version: 1
id: spec.system.diagrams.state-lifecycle
title: One Change Dossier Lifecycle
kind: state_lifecycle
purpose: Show one Change's semantic candidates, Evidence-backed review, Runtime routes, Integration/delivery boundaries, outcome disposition, and retention without implying that Change owns Project Runtime pipeline.
source_docs:
  - .codewiki/kb/system/components/loop-model.md
  - .codewiki/kb/system/components/loop-exit.md
  - .codewiki/kb/system/components/evidence.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/components/runtime.md
renderer:
  preferred: state_machine
  fallback: mermaid_state
states:
  - id: decision_active
    label: Decision active
  - id: planning_active
    label: Planning active
  - id: implementation_active
    label: Implementation active
  - id: review_ready
    label: Exact candidate awaiting user/team review
  - id: waiting
    label: Waiting / blocked / indeterminate
  - id: route_back
    label: Earlier authority required
  - id: realized
    label: Semantic realization accepted
  - id: integrated
    label: Integration proven
  - id: merged
    label: Project branch merged
  - id: pushed
    label: Remote branch pushed
  - id: published
    label: Artifact published
  - id: released
    label: Product released
  - id: outcome_dispositioned
    label: Outcome disposition recorded
  - id: closed
    label: Closed / retained
transitions:
  - from: decision_active
    to: planning_active
    trigger: Decision Exit Report passes and Runtime appends exact authorized approval
    trace_event: decision.change_approved
    exit_status: pass
    cleanup: remove private attempt material after durable refs exist
  - from: decision_active
    to: waiting
    trigger: required Decision Result is indeterminate or Runtime lacks authority/capability
    trace_event: decision.change_deferred
    exit_status: indeterminate
    cleanup: preserve bounded repair or retry evidence
  - from: planning_active
    to: implementation_active
    trigger: Planning Exit Report passes and complete epoch append is recovered
    trace_event: planning.change_planned
    exit_status: pass
    cleanup: remove private attempt material after durable refs exist
  - from: planning_active
    to: route_back
    trigger: Runtime route requires Decision meaning or authority
    trace_event: planning.change_replanned
    exit_status: fail
    cleanup: preserve bounded route evidence
  - from: planning_active
    to: waiting
    trigger: required Planning Result is indeterminate or Runtime wait applies
    trace_event: planning.change_replanned
    exit_status: indeterminate
    cleanup: preserve bounded repair or retry evidence
  - from: implementation_active
    to: realized
    trigger: no human review is required, Implementation Exit Report passes, and Runtime appends exact realization
    trace_event: implementation.evidence_accepted
    exit_status: pass
    cleanup: preserve worker material until Integration proof authorizes cleanup
  - from: implementation_active
    to: review_ready
    trigger: required non-approval review-readiness Checks pass and guarded CodeWiki/draft-PR Validation Bundle publication is authorized
    trace_event: runtime.review.published
    cleanup: preserve exact candidate, media, bundle, and provider correlation until final review disposition
  - from: review_ready
    to: realized
    trigger: authenticated approval receipt matches exact candidate/head/bundle and final Implementation Exit Report passes
    trace_event: implementation.evidence_accepted
    exit_status: pass
    cleanup: preserve approval and media refs until Integration/retention proof authorizes cleanup
  - from: review_ready
    to: implementation_active
    trigger: reviewer requests changes or candidate/head/preview/bundle drift invalidates approval
    trace_event: runtime.review.observed
    cleanup: preserve exact feedback and repair-parent evidence
  - from: review_ready
    to: waiting
    trigger: required review, provider, or media evidence is unavailable or indeterminate
    trace_event: runtime.review.observed
    exit_status: indeterminate
    cleanup: preserve bounded retry and review evidence
  - from: implementation_active
    to: route_back
    trigger: Runtime route requires Planning or Decision authority
    trace_event: implementation.evidence_rejected
    exit_status: fail
    cleanup: preserve bounded route and repair evidence
  - from: implementation_active
    to: waiting
    trigger: required Implementation Result is indeterminate or Runtime wait applies
    trace_event: implementation.evidence_rejected
    exit_status: indeterminate
    cleanup: preserve bounded retry evidence
  - from: route_back
    to: decision_active
    trigger: target authority is Decision
    trace_event: decision.change_revised
  - from: route_back
    to: planning_active
    trigger: target authority is Planning
    trace_event: planning.change_replanned
  - from: waiting
    to: decision_active
    trigger: Decision authority/evidence becomes available
    trace_event: decision.change_revised
  - from: waiting
    to: planning_active
    trigger: Planning dependency/evidence becomes available
    trace_event: planning.change_replanned
  - from: waiting
    to: implementation_active
    trigger: Implementation capability/evidence becomes available
    trace_event: implementation.evidence_rejected
  - from: realized
    to: integrated
    trigger: exact guarded Integration commit/tree proof recorded
    trace_event: runtime.integration.proven
  - from: integrated
    to: merged
    trigger: separately authorized local fast-forward merge recorded
    trace_event: runtime.project_branch.merged
  - from: merged
    to: pushed
    trigger: separately authorized exact remote push recorded
    trace_event: runtime.project_branch.pushed
  - from: pushed
    to: published
    trigger: separately authorized exact artifact publication recorded
    trace_event: runtime.product.published
  - from: published
    to: released
    trigger: separately authorized exact release promotion recorded
    trace_event: runtime.product.released
  - from: realized
    to: outcome_dispositioned
    trigger: no further delivery effect required and outcome disposition recorded
    trace_event: implementation.evidence_accepted
  - from: integrated
    to: outcome_dispositioned
    trigger: Integration is final required boundary and outcome disposition recorded
    trace_event: runtime.integration.proven
  - from: pushed
    to: outcome_dispositioned
    trigger: push is final required boundary and outcome disposition recorded
    trace_event: runtime.project_branch.pushed
  - from: published
    to: outcome_dispositioned
    trigger: publication is final required boundary and outcome disposition recorded
    trace_event: runtime.product.published
  - from: released
    to: outcome_dispositioned
    trigger: release is final required boundary and outcome disposition recorded
    trace_event: runtime.product.released
  - from: outcome_dispositioned
    to: closed
    trigger: retention policy permits close and no live dependency remains
    trace_event: trace_close
    cleanup: remove remaining private material after Git restore refs preserve history
