schema_version: 1
id: spec.system.diagrams.state-lifecycle
title: CodeWiki Trace State Lifecycle
kind: state_lifecycle
purpose: Show target trace lifecycle states, semantic loop iteration outcomes, runtime coordination, and cleanup boundaries.
source_docs:
  - .codewiki/kb/system/components/loop-model.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/components/runtime.md
renderer:
  preferred: state_machine
  fallback: mermaid_state
states:
  - id: decision_active
    label: Decision active
  - id: planning_active
    label: Planning active
  - id: implementation_active
    label: Implementation active
  - id: blocked
    label: Blocked or waiting
  - id: route_back
    label: Route-back recorded
  - id: production_ready
    label: Production ready
  - id: published
    label: Published
  - id: closed
    label: Closed / retained
transitions:
  - from: decision_active
    to: planning_active
    trigger: decision iteration exits
    trace_event: decision.changes_approved
    exit_status: exit
    cleanup: clean decision tmp after durable refs exist
  - from: decision_active
    to: blocked
    trigger: decision iteration blocks or continues without progress
    trace_event: decision.changes_approved
    exit_status: blocked
    cleanup: preserve decision tmp when remediation needs it
  - from: planning_active
    to: implementation_active
    trigger: planning iteration exits
    trace_event: planning.work_units_created
    exit_status: exit
    cleanup: clean planning tmp after durable refs exist
  - from: planning_active
    to: route_back
    trigger: planning needs decision authority
    trace_event: planning.work_units_created
    exit_status: route_back
    cleanup: preserve planning tmp when useful
  - from: planning_active
    to: blocked
    trigger: planning blocks or continues without progress
    trace_event: planning.work_units_created
    exit_status: blocked
    cleanup: preserve planning tmp when remediation needs it
  - from: implementation_active
    to: production_ready
    trigger: implementation iteration exits
    trace_event: implementation.evidence_accepted
    exit_status: exit
    cleanup: clean implementation tmp after durable refs exist
  - from: implementation_active
    to: route_back
    trigger: implementation needs planning or decision authority
    trace_event: implementation.evidence_accepted
    exit_status: route_back
    cleanup: preserve implementation tmp when useful
  - from: implementation_active
    to: blocked
    trigger: implementation blocks or continues without progress
    trace_event: implementation.evidence_accepted
    exit_status: blocked
    cleanup: preserve implementation tmp when remediation needs it
  - from: route_back
    to: decision_active
    trigger: target loop is decision
    trace_event: decision.changes_approved
  - from: route_back
    to: planning_active
    trigger: target loop is planning
    trace_event: planning.work_units_created
  - from: production_ready
    to: published
    trigger: optional publication proof recorded
    trace_event: implementation.evidence_accepted
    exit_status: exit
  - from: production_ready
    to: closed
    trigger: close without publication requirement
    trace_event: trace_close
    cleanup: delete all remaining trace tmp
  - from: published
    to: closed
    trigger: close after publication proof
    trace_event: trace_close
    cleanup: delete all remaining trace tmp
