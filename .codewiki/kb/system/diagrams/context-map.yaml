schema_version: 1
id: spec.system.diagrams.context-map
title: CodeWiki Context Map
kind: context_map
purpose: Show users, multi-source Change intake, clients, Project Runtime authority, Pi and worker execution, provider-neutral Git synchronization, repository authorities, review projection, archive, and guarded delivery boundaries.
source_docs:
  - .codewiki/kb/product/users/maintainers.md
  - .codewiki/kb/product/users/agents.md
  - .codewiki/kb/product/overview.md
  - .codewiki/kb/system/components/change-intake.md
  - .codewiki/kb/system/components/custom-checks.md
  - .codewiki/kb/system/components/runtime.md
  - .codewiki/kb/system/components/extension.md
  - .codewiki/kb/system/components/traces.md
  - .codewiki/kb/system/flows/remote-state-synchronization.md
renderer:
  preferred: graph
  fallback: mermaid_flowchart
actors:
  - id: maintainer
    label: Maintainer
    source: .codewiki/kb/product/users/maintainers.md
  - id: agent
    label: Agent / bounded integration
    source: .codewiki/kb/product/users/agents.md
  - id: adapter_author
    label: Client / worker adapter author
    source: .codewiki/kb/product/users/package-authors.md
  - id: reviewer
    label: Configured human or agent intent / Product / Design / code / security reviewer
    source: .codewiki/kb/system/components/evidence.md
  - id: external_user
    label: Future external user
    source: .codewiki/kb/product/users/external-users.md
systems:
  - id: cli
    label: Standalone CodeWiki CLI
    boundary: codewiki_client
    source: README.md
  - id: dashboard
    label: Local project dashboard
    boundary: codewiki_client
    source: .codewiki/kb/system/components/terminal-ui.md
  - id: pi_client
    label: Optional thin Pi client
    boundary: codewiki_client
    source: .codewiki/kb/system/components/extension.md
  - id: future_adapter
    label: MCP / editor / CI / OpenClaw adapter
    boundary: codewiki_client_or_worker
    source: .codewiki/kb/system/components/adapters-and-ui.md
  - id: project_runtime
    label: CodeWiki Project Runtime
    boundary: codewiki_authority
    source: .codewiki/kb/system/components/runtime.md
  - id: pi_runtime
    label: Pi providers / auth / sessions / compaction / tools / Skills
    boundary: host_execution
    source: .codewiki/kb/system/components/codewiki-os.md
  - id: semantic_sessions
    label: Independent Candidate and Model Check sessions
    boundary: codewiki_execution
    source: .codewiki/kb/system/components/session-coordination.md
  - id: workers
    label: Isolated process / OCI workers
    boundary: execution_sandbox
    source: .codewiki/kb/system/components/session-coordination.md
  - id: repository
    label: Knowledge / source / tests / protected Git
    boundary: repository_authorities
    source: .codewiki/kb/system/components/knowledge.md
  - id: git_state_remote
    label: Git remote codewiki/state + codewiki/archive
    boundary: synchronization_carrier
    source: .codewiki/kb/system/components/traces.md
  - id: model_providers
    label: Configured model providers
    boundary: external
  - id: review_surface
    label: Optional isolated review ref / draft pull request / ordinary review findings
    boundary: external_mutable_projection
    source: .codewiki/kb/system/components/adapters-and-ui.md
  - id: delivery_targets
    label: Publication / release / deployment / outcome providers
    boundary: external
relationships:
  - from: maintainer
    to: cli
    label: operates lifecycle and grants exact authority
  - from: maintainer
    to: dashboard
    label: manages Work Product System Design and Custom Checks
  - from: maintainer
    to: pi_client
    label: discusses intent and supervision
  - from: agent
    to: cli
    label: uses bounded automation contract
  - from: agent
    to: pi_client
    label: proposes and inspects
  - from: adapter_author
    to: future_adapter
    label: implements compatible boundary
  - from: reviewer
    to: review_surface
    label: reviews exact Validation Bundle
  - from: external_user
    to: dashboard
    label: inspects supported project state
  - from: cli
    to: project_runtime
    label: authenticated bounded requests
  - from: dashboard
    to: project_runtime
    label: guarded requests and state stream
  - from: pi_client
    to: project_runtime
    label: intent / authority / supervision / reads
  - from: future_adapter
    to: project_runtime
    label: typed client or Assignment protocol
  - from: project_runtime
    to: pi_runtime
    label: binds protocols Check Evaluators routes policy and scope
  - from: pi_runtime
    to: semantic_sessions
    label: creates independent bounded sessions
  - from: project_runtime
    to: workers
    label: dispatches exact Work Item Claim and Assignment
  - from: project_runtime
    to: repository
    label: reads authorities and performs guarded effects
  - from: project_runtime
    to: git_state_remote
    label: fetches, verifies, and expected-head pushes accepted state
  - from: pi_runtime
    to: model_providers
    label: owns provider authentication and invocation
  - from: workers
    to: repository
    label: mutates scoped isolated working state only
  - from: workers
    to: project_runtime
    label: asserted Worker Report and bounded Assignment-bound discoveries
  - from: repository
    to: project_runtime
    label: exact regression scanner and Knowledge-drift intake material
  - from: project_runtime
    to: review_surface
    label: guarded review projection and re-observation
  - from: review_surface
    to: project_runtime
    label: findings and approval remain untrusted until exact actor/head/bundle correlation
  - from: project_runtime
    to: delivery_targets
    label: separately authorized exact effects
  - from: delivery_targets
    to: project_runtime
    label: exact delivery/outcome observations may become bounded intake
ui_hints:
  default_scope: codewiki_authority
  inspector_fields:
    - source
    - boundary
    - label
