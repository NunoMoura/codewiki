schema_version: 1
id: spec.system.diagrams.context-map
title: CodeWiki Context Map
kind: context_map
purpose: Show who manages a CodeWiki project, which clients connect, where execution occurs, and where repository and external boundaries sit.
source_docs:
  - .codewiki/kb/product/users/maintainers.md
  - .codewiki/kb/product/users/agents.md
  - .codewiki/kb/product/users/package-authors.md
  - .codewiki/kb/product/users/external-users.md
  - .codewiki/kb/system/components/runtime.md
  - .codewiki/kb/system/components/codewiki-os.md
  - .codewiki/kb/system/components/model-routing.md
  - .codewiki/kb/system/components/session-coordination.md
  - .codewiki/kb/system/components/adapters-and-ui.md
  - .codewiki/kb/system/components/extension.md
  - .codewiki/kb/system/components/api.md
renderer:
  preferred: graph
  fallback: mermaid_flowchart
actors:
  - id: maintainer
    label: Maintainer
    source: .codewiki/kb/product/users/maintainers.md
  - id: agent
    label: Agent / bounded integration
    source: .codewiki/kb/product/users/agents.md
  - id: package_author
    label: Extension/workflow author
    source: .codewiki/kb/product/users/package-authors.md
  - id: future_external_user
    label: Future external user
    source: .codewiki/kb/product/users/external-users.md
systems:
  - id: dashboard
    label: Local project dashboard
    boundary: codewiki_client
    source: .codewiki/kb/system/components/terminal-ui.md
  - id: pi_client
    label: Pi conversational client
    boundary: codewiki_client
    source: .codewiki/kb/system/components/extension.md
  - id: future_client
    label: CLI / MCP / editor / CI client
    boundary: codewiki_client
    source: .codewiki/kb/system/components/adapters-and-ui.md
  - id: control_plane
    label: CodeWiki project control plane
    boundary: codewiki
    source: .codewiki/kb/system/components/runtime.md
  - id: pi_runtime
    label: Pi providers / auth / tools / sessions / Skills
    boundary: host_execution
    source: .codewiki/kb/system/components/codewiki-os.md
  - id: pi_sdk_sessions
    label: Embedded Pi semantic sessions
    boundary: codewiki_execution
    source: .codewiki/kb/system/components/session-coordination.md
  - id: isolated_workers
    label: Process / container implementation workers
    boundary: execution_sandbox
    source: .codewiki/kb/system/components/session-coordination.md
  - id: repo_contract
    label: Repo-local Knowledge / traces / source / tests / Git
    boundary: repository
    source: .codewiki/kb/system/components/knowledge.md
  - id: model_providers
    label: Configured model providers
    boundary: external
  - id: git_remote
    label: Git remotes / publication targets
    boundary: external
relationships:
  - from: maintainer
    to: dashboard
    label: manages Work, Product, System, and Design
  - from: maintainer
    to: pi_client
    label: discusses intent and grants exact authority
  - from: agent
    to: pi_client
    label: proposes and inspects through bounded capabilities
  - from: package_author
    to: future_client
    label: implements compatible client adapters
  - from: future_external_user
    to: dashboard
    label: inspects supported project state
  - from: dashboard
    to: control_plane
    label: guarded local requests and state stream
  - from: pi_client
    to: control_plane
    label: intent, authority, supervision, and reads
  - from: future_client
    to: control_plane
    label: bounded local protocol
  - from: control_plane
    to: pi_runtime
    label: binds CodeWiki OS, Stage Protocol, route, policy, and Workbench scope
  - from: pi_runtime
    to: pi_sdk_sessions
    label: creates read-only semantic and verifier sessions
  - from: control_plane
    to: isolated_workers
    label: activates claimed private Workbenches
  - from: control_plane
    to: repo_contract
    label: reads truth and performs guarded writes
  - from: pi_runtime
    to: model_providers
    label: owns provider authentication and invocation
  - from: isolated_workers
    to: repo_contract
    label: changes scoped isolated working state
  - from: repo_contract
    to: git_remote
    label: synchronizes only under explicit authority
ui_hints:
  default_scope: codewiki_boundary
  inspector_fields:
    - source
    - boundary
    - label
