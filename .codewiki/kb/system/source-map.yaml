schema_version: 1
id: spec.system.source-map
title: CodeWiki Source Ownership Map
kind: source_map
purpose: Canonical machine-readable mapping between source ownership roots, KB docs, tests, generated views, and trace/event responsibilities.
updated: "2026-06-12"
source_docs:
  - .codewiki/kb/system/source-map.md
  - .codewiki/kb/system/loop-model.md
  - .codewiki/kb/system/overview.md
defaults:
  inheritance: true
  max_owner_depth: 2
  excluded:
    - node_modules/**
    - .pi/**
    - .git/**
    - coverage/**
    - dist/**
    - "**/*.d.ts"
    - "**/*.tgz"
rules:
  - Source ownership is declared here during OKF migration; generated OKF extension fields must be derived from this map until parity supports deprecation.
  - Subpaths inherit the nearest owning component unless a more specific component entry exists.
  - Every active source ownership root needs one owning doc and tests or an explicit no-test rationale.
  - Diagrams map concepts; this file maps source ownership.
components:
  package:
    doc: README.md
    source:
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - src/index.ts
    tests:
      - tests/scaffold.test.mjs
      - tests/runtime/package-install-smoke.mjs
      - tests/runtime/project-local-install-smoke.mjs
      - tests/runtime/external-package-lifecycle-smoke.mjs
      - tests/runtime/external-package-failures-smoke.mjs
      - tests/runtime/readiness-checklist.test.mjs
    role: package_entrypoint
  lab:
    doc: .codewiki/kb/system/lab.md
    source:
      - lab/**
    tests:
      - tests/lab/**
    role: loop_exit_experimentation
  api:
    doc: .codewiki/kb/system/api.md
    source:
      - src/api/**
    tests:
      - tests/scaffold.test.mjs
      - tests/views/wiki-state.test.mjs
      - tests/decision/wiki-decide.test.mjs
      - tests/planning/wiki-plan.test.mjs
      - tests/implementation/repo-proof.test.mjs
      - tests/implementation/wiki-implement.test.mjs
      - tests/runtime/wiki-runtime.test.mjs
      - tests/runtime/wiki-config.test.mjs
      - tests/traces/wiki-archive.test.mjs
    role: public_facade
  decision:
    doc: .codewiki/kb/system/decision-loop.md
    source:
      - src/decision/**
      - src/api/decision.ts
    tests:
      - tests/decision/**
      - tests/helpers/decision-row.mjs
    trace_events:
      - decision.rows_approved
    role: semantic_loop
  planning:
    doc: .codewiki/kb/system/planning-loop.md
    source:
      - src/planning/**
      - src/api/planning.ts
    tests:
      - tests/planning/**
      - tests/helpers/planning-work.mjs
    generated_views:
      - .codewiki/views/work-plan.json
      - .codewiki/views/work-queue.json
      - .codewiki/views/triggers.json
      - .codewiki/views/quality.json
    trace_events:
      - planning.work_units_created
    role: semantic_loop
  implementation:
    doc: .codewiki/kb/system/implementation-loop.md
    source:
      - src/implementation/**
      - src/api/implementation.ts
    tests:
      - tests/implementation/**
      - tests/helpers/implementation-change.mjs
    trace_events:
      - implementation.evidence_accepted
    role: semantic_loop
  loop_standards:
    doc: .codewiki/kb/system/loop-contracts.md
    source:
      - src/loops/**
    tests:
      - tests/loops/**
      - tests/decision/**
      - tests/planning/**
      - tests/implementation/**
      - tests/lab/**
    role: loop_standard_engine
  traces:
    doc: .codewiki/kb/system/traces.md
    source:
      - src/traces/**
      - src/api/traces.ts
    tests:
      - tests/traces/**
    trace_events:
      - trace_head
      - trace_event
      - tail_checkpoint
      - trace_close
    role: state_truth
  views:
    doc: .codewiki/kb/system/traces.md
    source:
      - src/views/**
      - src/api/views.ts
    tests:
      - tests/views/**
    generated_views:
      - .codewiki/views/status.json
      - .codewiki/views/resume.json
      - .codewiki/views/work-plan.json
      - .codewiki/views/work-queue.json
      - .codewiki/views/trace-board.json
      - .codewiki/views/triggers.json
      - .codewiki/views/runtime-board.json
      - .codewiki/views/quality.json
      - .codewiki/views/blockers.json
      - .codewiki/views/conflicts.json
    role: generated_projection
  knowledge:
    doc: .codewiki/kb/system/knowledge.md
    source:
      - src/knowledge/**
      - .codewiki/kb/**
    tests:
      - tests/knowledge/**
      - tests/scaffold.test.mjs
    role: hot_knowledge
  skills:
    doc: .codewiki/kb/system/api-tools.md
    source:
      - .agents/skills/**
    tests:
      - tests/knowledge/skills.test.mjs
    role: host_guidance
  git:
    doc: .codewiki/kb/system/implementation-loop.md
    source:
      - src/git/**
    tests:
      - tests/implementation/**
      - tests/runtime/git-status.test.mjs
      - tests/runtime/worktrees.test.mjs
    role: content_proof
  runtime:
    doc: .codewiki/kb/system/runtime.md
    source:
      - src/runtime/**
    tests:
      - tests/runtime/**
    trace_events:
      - runtime.work_unit.claimed
      - runtime.work_unit.claim.released
      - runtime.work_unit.claim.expired
      - runtime.work_unit.claim.cancelled
      - runtime.host.started
      - runtime.host.observed
      - runtime.host.blocked
      - runtime.host.completed
      - runtime.host.stopped
    role: outer_loop_coordination
  error_handling:
    doc: .codewiki/kb/system/runtime.md
    source:
      - src/error-handling/**
    tests:
      - tests/runtime/**
    role: shared_error_contracts
  cli:
    doc: .codewiki/kb/system/api.md
    source:
      - src/cli/**
    tests:
      - tests/runtime/cli.test.mjs
    role: temporary_development_harness
  pi:
    doc: .codewiki/kb/system/extension.md
    source:
      - src/pi/**
    tests:
      - tests/runtime/pi-worker-start.test.mjs
      - tests/runtime/pi-extension.test.mjs
      - tests/runtime/pi-install-smoke.mjs
      - tests/runtime/pi-install-scope.test.mjs
      - tests/runtime/pi-process-session.test.mjs
      - tests/runtime/pi-rpc-smoke.mjs
      - tests/runtime/pi-tool-mutation-smoke.mjs
      - tests/runtime/pi-worker-results.test.mjs
      - tests/runtime/package-install-smoke.mjs
      - tests/runtime/project-local-install-smoke.mjs
      - tests/runtime/external-package-lifecycle-smoke.mjs
      - tests/runtime/external-package-failures-smoke.mjs
    role: host_adapter
  project:
    doc: .codewiki/kb/system/source-map.md
    source:
      - src/project/**
    tests:
      - tests/scaffold.test.mjs
      - tests/project/**
      - tests/implementation/repo-proof.test.mjs
      - tests/runtime/wiki-config.test.mjs
    role: project_boundary
  utils:
    doc: .codewiki/kb/system/source-map.md
    source:
      - src/utils/**
    test_policy: inherited
    test_rationale: Domain-free utilities are tested through owning consumers until a utility grows its own contract.
    role: domain_free_primitives
